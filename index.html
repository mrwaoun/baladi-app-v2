<!-- Where Baladi is served as a folder, these two small files beside index.html
     let Android and desktop browsers offer a one-tap Install. Served as a single
     file on its own they simply are not found, and the button falls back to the
     written steps for that phone \u2014 which is all iPhone ever needed. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#EFEBE4; --surface:#FBFAF7; --surface-2:#E8E3DA; --surface-3:#F4F1EB;
  --ink:#211D18; --ink-2:#544C42; --muted:#6F665B;
  --line:#DBD4C9; --line-soft:#E7E2D9;
  --accent:#7A5230; --accent-ink:#5E3E22; --accent-soft:#EEE5D9;
  --stamp:#A5442C; --stamp-soft:#F5E5DF;
  --rail:#26221D; --rail-ink:#DDD7CD;
  --good:#1a7f37; --good-soft:#E4F0E4; --warn:#9A6B00; --warn-soft:#FBF0D8;
  --crit:#B3261E; --crit-soft:#F8E3E1;
  --gold:#A5791F; --gold-soft:#F6EEDA;
  --s1:#1D6FA3; --s2:#A05A00;   /* recycling, composting — validated for CVD on both surfaces */
  --shadow:0 1px 2px rgba(33,29,24,.06), 0 10px 30px -18px rgba(33,29,24,.35);
  /* Type scale. Bigger text must not mean a longer screen, so every step up
     takes its room back out of the padding, the gaps and the chrome rather than
     out of what fits. --pad and --gap fall as --ts rises. */
  --ts:1; --ts2:1; --lh:1.5; --pad:13px; --padv:11px; --gap:10px; --vpad:12px; --vpadx:15px;
}
/* Three levers, not one. Primary type grows, supporting type grows less, and the
   line spacing tightens — so a name gets markedly bigger while the block it sits
   in gets no taller. The padding and the gaps pay for the rest. */
.device[data-ts="2"]{ --ts:1.12; --ts2:1.04; --lh:1.40; --pad:11px; --padv:9px;   --gap:8px;  --vpad:9px;  --vpadx:12px; }
.device[data-ts="3"]{ --ts:1.26; --ts2:1.08; --lh:1.30; --pad:9px;  --padv:7.5px; --gap:6px;  --vpad:7px;  --vpadx:10px; }
.device[data-ts="3"] .ill,.device[data-ts="3"] .illw{max-height:88px}
.device[data-ts="3"] .note{padding:8px 10px}
/* At the largest size two buttons side by side stop fitting their own labels:
   "Open in maps" wrapped and then clipped. A row of two becomes a stack of
   two, which is the right shape for this reader anyway — one action, one line,
   one icon, the full width of a thumb. */
.device[data-ts="3"] .btnrow{flex-direction:column;gap:8px}
.device[data-ts="3"] .btnrow>*{width:100%}
.device[data-ts="3"] .btn{justify-content:flex-start;gap:10px}
.device[data-ts="3"] .btn .ic3{width:21px;height:21px}
.device[data-ts="3"] .appbar{padding:4px 12px 8px}
.device[data-ts="3"] .statusbar{padding:6px 14px 2px}
.device[data-ts="2"] .appbar{padding:5px 14px 10px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#141210; --surface:#1D1A16; --surface-2:#262119; --surface-3:#201C17;
    --ink:#EFEBE4; --ink-2:#B7AEA1; --muted:#9A9084;
    --line:#332D25; --line-soft:#282219;
    --accent:#C08347; --accent-ink:#D9AC7C; --accent-soft:#2A2118;
    --stamp:#D0785C; --stamp-soft:#2E1B15;
    --rail:#100E0C; --rail-ink:#D5CFC5;
    --good:#5FD15F; --good-soft:#15251A; --warn:#F7C45C; --warn-soft:#2A2110;
    --crit:#E87373; --crit-soft:#2C1513;
    --gold:#D9B45A; --gold-soft:#272015;
    --s1:#4A94C6; --s2:#B8822A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:calc(15px*var(--ts));line-height:var(--lh);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;margin:0;letter-spacing:-.015em;text-wrap:balance}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:"IBM Plex Sans Arabic",sans-serif;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}

/* ---------- device shell ---------- */
.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px;
  background:radial-gradient(1200px 700px at 50% -10%, var(--surface-3), var(--paper) 70%)}
.device{width:404px;height:min(880px, calc(100dvh - 48px));background:var(--surface);border:1px solid var(--line);
  border-radius:34px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:calc(11.5px*var(--ts2));
  color:var(--muted);font-family:"IBM Plex Mono",monospace;flex:none}
/* The strip across the top of the front page that puts Baladi on the phone's
   own home screen. It is the first thing on the screen and the first thing
   gone once it is used or waved away, and it never appears again inside the
   installed app \u2014 there is nothing left to add there. */
.addbar{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;margin:2px 10px 0;flex:none;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:13px;z-index:6}
.addbar>.ai{display:grid;place-items:center;width:30px;height:30px;min-width:30px;border-radius:9px;
  background:var(--accent);color:#FBF7F2;flex:none}
.addbar>.ai svg{width:18px;height:18px;stroke-width:2.4}
.addbar .at{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.addbar .at b{font-size:calc(13px*var(--ts2));font-weight:700;color:var(--accent-ink)}
.addbar .at span{font-size:calc(11px*var(--ts2));color:var(--accent-ink);opacity:.82}
.addbar .at b,.addbar .at span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbar .ago{flex:none;padding:7px 11px;border-radius:10px;background:var(--accent);border:1px solid var(--accent);
  color:#FBF7F2;font-size:calc(12px*var(--ts2));font-weight:700;min-height:34px;display:flex;align-items:center;gap:5px}
.addbar .ago svg{width:14px;height:14px;stroke-width:2.4}
.addbar .ax{flex:none;display:grid;place-items:center;width:28px;height:28px;min-width:28px;border-radius:9px;
  color:var(--accent-ink);opacity:.72}
.addbar .ax svg{width:14px;height:14px;stroke-width:2.4}
.device[data-ts="3"] .addbar{padding:9px 12px}
.howstep{display:flex;align-items:center;gap:11px;padding:9px 11px;background:var(--surface-3);
  border:1px solid var(--line);border-radius:12px}
.howstep>.n{display:grid;place-items:center;width:24px;height:24px;min-width:24px;border-radius:50%;
  background:var(--accent);color:#FBF7F2;font-weight:700;font-size:12px;flex:none}
.howstep>.ic{width:24px;height:24px;flex:none;stroke-width:2.6;color:var(--accent-ink)}
.howstep>span{font-size:calc(13px*var(--ts2));line-height:1.35}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;flex:none;border-bottom:1px solid var(--line-soft);background:var(--surface);z-index:5}
.appbar .ttl{font-family:"Archivo",sans-serif;font-size:calc(19px*var(--ts));font-weight:600;line-height:1.2;flex:1;min-width:0}
.appbar .sub{font-size:calc(11.5px*var(--ts2));color:var(--muted);font-weight:400;display:block;letter-spacing:0}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:19px;height:19px}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--vpad) var(--vpadx) 20px;display:flex;flex-direction:column;gap:var(--gap);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.view>*{flex:0 0 auto}
.login>*{flex:0 0 auto}
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:calc(10.5px*var(--ts2));font-weight:500}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--accent-ink);font-weight:700}
.tabbar button.on svg{stroke-width:2.1}
.sidecard{width:300px;display:none;flex-direction:column;gap:14px}
@media(min-width:1040px){.sidecard{display:flex}}
@media(max-width:860px){
  .page{padding:0;display:block;background:var(--paper)}
  .device{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none}
  .statusbar{padding-top:calc(8px + env(safe-area-inset-top))}
}

/* ---------- primitives ---------- */
.card{background:var(--surface-3);border:1px solid var(--line);border-radius:14px;padding:var(--padv) var(--pad);display:flex;flex-direction:column;gap:6px}
.card.plain{background:var(--surface)}
.card.acc{background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent) 26%,transparent)}
.card.gold{background:var(--gold-soft);border-color:color-mix(in oklab,var(--gold) 34%,transparent)}
.card.flat{background:transparent;border-style:dashed}
.eyebrow{font-size:calc(10.5px*var(--ts2));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h{font-family:"Archivo",sans-serif;font-size:calc(16px*var(--ts));font-weight:600;line-height:1.25}
.big{font-family:"Archivo",sans-serif;font-size:calc(29px*var(--ts));font-weight:700;letter-spacing:-.03em;line-height:1.08}
.sm{font-size:calc(12px*var(--ts2));color:var(--muted);line-height:var(--lh)}
.b2{font-size:calc(13.5px*var(--ts));color:var(--ink-2);line-height:var(--lh)}
.sect{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.sect .eyebrow{flex:1}
.link{font-size:calc(12.5px*var(--ts2));color:var(--accent-ink);font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;min-height:44px;
  font-size:calc(14.5px*var(--ts));font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;transition:.12s}
.btn:active{transform:scale(.99)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#FBF7F2}
.btn.d{border-color:var(--stamp);color:var(--stamp)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#241C08}
.btn.sm{padding:8px 11px;font-size:calc(13px*var(--ts));border-radius:10px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
[hidden]{display:none!important}
svg.ic{width:17px;height:17px;flex:none}
/* An icon that has to be understood rather than recognised wants more ink and
   more room. ic3 thickens the stroke, icL and icXL enlarge it. Used on the
   field screens, where the word beside the icon is support and not the message. */
svg.ic3{stroke-width:2.7}
svg.icL{width:24px;height:24px;flex:none}
svg.icXL{width:34px;height:34px;flex:none}
/* read-aloud: a tap target big enough for a gloved thumb, never smaller than 44px */
.sayb{width:44px;height:44px;min-width:44px;border-radius:12px;display:grid;place-items:center;
  color:var(--accent-ink);background:var(--accent-soft);flex:none;
  border:1px solid color-mix(in oklab,var(--accent) 24%,transparent)}
.sayb svg{width:22px;height:22px}
.sayb.on{background:var(--accent);color:#FBF7F2;border-color:var(--accent)}
.sayb[hidden]{display:none}
/* The per-control speaker. One on every button, every segment of a choice and
   every form field, so a person who cannot read can hear what each one is before
   pressing it. Kept visually quiet — it sits at the end of the control in muted
   ink and only colours when it is speaking — because forty loud speakers on one
   screen is its own kind of unreadable. */
/* The switch, in the status bar, present on every screen including sign-in.
   Off it is quiet ink; on it is unmistakable, because somebody relying on it
   needs to know at a glance whether it is listening. */
.sndtog{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);background:var(--surface);
  font-size:calc(10.5px*var(--ts2));font-weight:700;letter-spacing:.01em;min-height:26px;flex:none}
.sndtog svg{width:14px;height:14px;stroke-width:2.4;flex:none}
.sndtog.on{background:var(--accent);border-color:var(--accent);color:#FBF7F2}
.device[data-ts="3"] .sndtog{padding:4px 11px 4px 9px;min-height:30px}
.device[data-ts="3"] .sndtog svg{width:16px;height:16px}
/* What has been read once and will act on the next touch. It has to be obvious
   without being read, because the person it is for is not reading it. */
.armed{position:relative;outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.armed::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--accent);opacity:.10;pointer-events:none}
.device[data-ts="2"] .chip .ic{width:17px;height:17px}
.device[data-ts="3"] .chip .ic{width:19px;height:19px}

/* a row whose whole point is one icon, one word, one tap */
.bigrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  padding:14px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
  font-weight:700;font-size:calc(15.5px*var(--ts))}
.bigrow svg{width:30px;height:30px;flex:none;stroke-width:2.3}
.bigrow>span.lab{flex:1;min-width:0;line-height:1.25}
/* high contrast: white on a dark ground, which holds in either theme because the
   ground is a fixed colour rather than a themed surface */
.hc{background:#221E19;color:#FFFFFF;border-color:#221E19}
.hc .sm,.hc .b2,.hc>span,.hc .kv>span{color:#E9E4DC}
.hc .kv{border-bottom-color:rgba(255,255,255,.16)}
.hc svg{color:#FFFFFF}
.hc.good{background:#13532A}
.hc.bad{background:#7E2015}
.hc.warn{background:#6A4300}
.sayb.hcb{background:rgba(255,255,255,.14);color:#FFFFFF;border-color:rgba(255,255,255,.3)}
.btn .ic{width:17px;height:17px;flex:none}
.btn.row{justify-content:space-between;text-align:start}
.btnrow{display:flex;gap:8px}
.btnrow .btn{width:auto;flex:1}

.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line-soft);font-size:calc(13.5px*var(--ts))}
.kv:last-child{border-bottom:none}
.kv>span{color:var(--ink-2)}
.kv>b{font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:calc(var(--padv) - 2px) 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:start}
.item:last-child{border-bottom:none}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t b{font-size:calc(14px*var(--ts));font-weight:600}
.item .t span{font-size:calc(11.5px*var(--ts2));color:var(--muted)}
.item .r{text-align:end;display:flex;flex-direction:column;gap:2px;flex:none}
.item .r b{font-size:calc(14px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums}
.item .r span{font-size:calc(11px*var(--ts2));color:var(--muted)}
.av{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent-ink);font-weight:700;font-size:calc(13px*var(--ts))}
.av svg{width:18px;height:18px}
.chev{color:var(--muted);flex:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:calc(11px*var(--ts2));font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-good{color:var(--good);background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 30%,transparent)}
.p-warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 34%,transparent)}
.p-crit{color:var(--crit);background:var(--crit-soft);border-color:color-mix(in oklab,var(--crit) 30%,transparent)}
.p-acc{color:var(--accent-ink);background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent) 30%,transparent)}
.p-neut{color:var(--ink-2);background:var(--surface-2);border-color:var(--line)}
.p-gold{color:var(--gold);background:var(--gold-soft);border-color:color-mix(in oklab,var(--gold) 36%,transparent)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-3);border:1px solid var(--line);border-radius:13px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.stat b{font-family:"Archivo",sans-serif;font-size:calc(21px*var(--ts));font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:calc(10.5px*var(--ts2));color:var(--muted);line-height:1.35}
.stat b svg{width:21px;height:21px;display:block;stroke-width:1.7}

input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:calc(15px*var(--ts))}
textarea{resize:vertical;min-height:72px}
label.fld{display:flex;flex-direction:column;gap:5px}
#custblock{display:flex;flex-direction:column;gap:12px}
label.fld>span{font-size:calc(11.5px*var(--ts2));color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{position:relative;flex:1;padding:8px 4px;font-size:calc(12.5px*var(--ts2));font-weight:600;border-radius:9px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;border:1px solid var(--line);font-size:calc(12.5px*var(--ts2));font-weight:600;color:var(--ink-2);background:var(--surface)}
.chip .ic{width:16px;height:16px;flex:none;stroke-width:2.4}
/* the pictogram belongs beside the words it stands for, not at the far edge of
   the row, so one reads as a single thing and the status pill keeps its corner */
.rl{display:flex;align-items:center;gap:9px;min-width:0;text-align:start}
.rl .ic{flex:none}
.okm{color:var(--good)}
.badm{color:var(--crit)}
.picks{display:flex;flex-direction:column;gap:8px}
.picks .btn.row{width:100%}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sw{width:46px;height:27px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:.16s}
.sw:after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.16s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on:after{inset-inline-start:23px}

.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar.g i{background:var(--gold)}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .lab{display:flex;justify-content:space-between;font-size:calc(12.5px*var(--ts2))}

.note{display:flex;gap:9px;align-items:flex-start;border-radius:12px;padding:9px 11px;background:var(--accent-soft);
  border:1px solid color-mix(in oklab,var(--accent) 24%,transparent);font-size:calc(12.5px*var(--ts2));color:var(--ink-2);line-height:1.45}
.note.w{background:var(--warn-soft);border-color:color-mix(in oklab,var(--warn) 34%,transparent)}
.note.c{background:var(--crit-soft);border-color:color-mix(in oklab,var(--crit) 30%,transparent)}
.note.g{background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 30%,transparent)}
.note.g svg{color:var(--good)}
.btn.row.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
select.sel,label.fld>select{appearance:none;-webkit-appearance:none;width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);color:var(--ink);font:inherit;font-size:calc(13.5px*var(--ts))}
.note b{display:block;color:var(--ink);font-size:calc(13px*var(--ts));margin-bottom:2px}
.note svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--accent-ink)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:calc(12.5px*var(--ts2))}
th{font-size:calc(10px*var(--ts2));letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:start;
  padding:8px 10px;background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tr:last-child td{border-bottom:none}
.ta-e{text-align:end}

/* ---------- scanner ---------- */
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#15120F;aspect-ratio:1/1;display:grid;place-items:center}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanbox canvas{display:none}
.scanbox img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:relative;width:64%;aspect-ratio:1;border-radius:16px;box-shadow:0 0 0 2000px rgba(16,13,11,.45)}
.reticle:before,.reticle:after,.reticle>i:first-child:before,.reticle>i:first-child:after{content:"";position:absolute;width:32px;height:32px;border:3px solid #E0B27C}
.reticle:before{top:-1px;inset-inline-start:-1px;border-width:3px 0 0 3px;border-radius:12px 0 0 0}
.reticle:after{top:-1px;inset-inline-end:-1px;border-width:3px 3px 0 0;border-radius:0 12px 0 0}
.reticle>i:first-child:before{bottom:-1px;inset-inline-start:-1px;border-width:0 0 3px 3px;border-radius:0 0 0 12px}
.reticle>i:first-child:after{bottom:-1px;inset-inline-end:-1px;border-width:0 3px 3px 0;border-radius:0 0 12px 0}
.scanline{position:absolute;inset-inline:6%;height:2px;background:#E0B27C;opacity:.85;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{top:12%}50%{top:86%}}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;top:50%}}
.scancap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:calc(11.5px*var(--ts2));color:#E8CCA8;font-family:"IBM Plex Mono",monospace}
.scanstate{position:absolute;top:10px;inset-inline-start:10px;background:rgba(21,18,15,.8);color:#E8CCA8;border-radius:8px;
  padding:4px 8px;font-size:calc(11px*var(--ts2));font-weight:600;display:flex;align-items:center;gap:6px}
.dotlive{width:7px;height:7px;border-radius:50%;background:#4ED07B;box-shadow:0 0 0 0 rgba(78,208,123,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(78,208,123,0)}100%{box-shadow:0 0 0 0 rgba(78,208,123,0)}}
.hidden-input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* ---------- sheet, toast, overlay ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,13,11,.5);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate(-50%,110%);bottom:0;width:min(404px,100%);background:var(--surface);
  border-radius:20px 20px 0 0;border:1px solid var(--line);z-index:70;transition:transform .26s cubic-bezier(.2,.7,.3,1);
  max-height:84dvh;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:translate(-50%,0)}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .shead{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-2px;
  background:var(--surface);z-index:2;padding:4px 0}
.sheet .shead h3{font-size:calc(17px*var(--ts));font-weight:600;flex:1}
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:92px;background:var(--ink);color:var(--paper);
  padding:11px 15px;border-radius:12px;font-size:calc(13px*var(--ts));font-weight:500;z-index:90;opacity:0;transition:.2s;
  max-width:min(360px,92vw);text-align:center;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- login ---------- */
.login{flex:1;display:flex;flex-direction:column;gap:16px;padding:22px 22px calc(28px + env(safe-area-inset-bottom));
  background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.login>:first-child{margin-top:auto}
.login>:last-child{margin-bottom:auto}
.mark{width:62px;height:62px;border-radius:14.4px;display:block;flex:none;overflow:hidden}
.mark.sm{width:34px;height:34px;border-radius:7.9px}
.mark svg{display:block;width:100%;height:100%}
.wordmark{font-family:"Archivo",sans-serif;font-size:calc(27px*var(--ts));font-weight:700;letter-spacing:-.02em}
.otpbox{display:flex;gap:8px;justify-content:space-between}
.otpbox input{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:calc(21px*var(--ts));padding:13px 0;width:100%}
.rolegrid{display:flex;flex-direction:column;gap:9px}
.rolecard{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--surface-3);width:100%;text-align:start}
.rolecard:hover{border-color:var(--accent)}
.rolecard .t{flex:1}
.rolecard .t b{display:block;font-size:calc(14.5px*var(--ts));font-weight:600}
.rolecard .t span{font-size:calc(11.5px*var(--ts2));color:var(--muted)}

.quiz .opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:calc(14px*var(--ts));width:100%;text-align:start}
.quiz .opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.quiz .opt.wrong{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.quiz .opt .k{width:24px;height:24px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:calc(11.5px*var(--ts2));font-weight:700;flex:none}

.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ticket:before,.ticket:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--paper);border:1px solid var(--line);top:50%;transform:translateY(-50%)}
.ticket:before{inset-inline-start:-7px}
.ticket:after{inset-inline-end:-7px}
.ticket .th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ticket .tt{font-size:calc(13.5px*var(--ts));font-weight:600}
.ticket .ser{font-family:"IBM Plex Mono",monospace;font-size:calc(10.5px*var(--ts2));color:var(--accent-ink);white-space:nowrap;direction:ltr}
.ticket .tm{display:flex;justify-content:space-between;gap:10px;font-size:calc(11px*var(--ts2));color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.ticket.void{opacity:.55}

.timer{font-family:"IBM Plex Mono",monospace;font-size:calc(34px*var(--ts));font-weight:600;text-align:center;letter-spacing:-.02em}
.map{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#E6E1D6}
.map svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:calc(11px*var(--ts2));color:var(--ink-2);padding:7px 10px;background:var(--surface);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surface)}
.wheel{height:64px;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wheel .w{position:absolute;inset:0;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:calc(18px*var(--ts));font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* compact quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface-3);border:1px solid var(--line);border-radius:13px;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.quick button svg{width:20px;height:20px;color:var(--ink-2);stroke-width:1.7}
.quick button span{font-size:calc(10px*var(--ts2));color:var(--muted);line-height:1.2}
/* fold — the detail stays, the space comes back */
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 13px}
details.fold>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:8px;
  font-size:calc(12.5px*var(--ts2));font-weight:600;color:var(--ink-2)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"";margin-inline-start:auto;width:7px;height:7px;border-inline-end:2px solid var(--muted);
  border-block-end:2px solid var(--muted);transform:rotate(45deg);transition:transform .18s;flex:none}
details.fold[open]>summary:after{transform:rotate(-135deg)}
details.fold>.fb{padding-bottom:11px;display:flex;flex-direction:column;gap:6px}
/* desktop viewing mode: real columns, measured and filled, so nothing is fragmented */
.page.wide{align-items:center}
.page.wide .device{width:min(1280px, calc(100vw - 48px));height:min(940px, calc(100dvh - 48px));border-radius:26px}
.page.wide .sidecard{display:none}
.page.wide .statusbar{padding:12px 28px 4px}
.page.wide .appbar{padding:10px 26px 15px}
.page.wide .appbar .ttl{font-size:calc(22px*var(--ts))}
.page.wide .appbar .sub{font-size:calc(12.5px*var(--ts2))}
.page.wide .view{flex-direction:column;align-items:stretch;gap:12px;padding:20px 26px 28px;
  max-width:760px;margin-inline:auto;width:100%}
.page.wide .view.cols{flex-direction:row;align-items:flex-start;gap:22px;max-width:none;margin-inline:0}
.page.wide .wcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:13px}
.page.wide .wcol>*{flex:0 0 auto}
.page.wide .card{padding:13px 15px}
.page.wide .b2,.page.wide .sm{line-height:1.55}
/* A carousel is a thumb gesture. On a desktop there is no thumb and there is room,
   so the same cards are laid out in full and the swipe affordance is retired. */
.page.wide .carou{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin:0;padding:0;
  overflow:visible;scroll-snap-type:none}
.page.wide .carou>*{flex:none;width:auto;scroll-snap-align:none}
.page.wide .carou+.dots{display:none}

.page.wide .login{max-width:1020px;margin-inline:auto;padding:24px 26px 30px}
/* on a desktop every interface fits on one screen, so none of them is hidden below a fold */
.page.wide .rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.page.wide .rolecard{align-items:flex-start}
.page.wide .rolecard .chev{display:none}
.page.wide .tabbar{padding:9px 6px 9px}
.page.wide .tabbar button span{font-size:calc(12px*var(--ts2))}
.page.wide .sheet{width:min(560px,100%)}
@media(max-width:1000px){ .page.wide .device{width:100%;height:100dvh;border:none;border-radius:0}
  .page.wide .view{flex-direction:column;gap:10px;padding:14px 16px 24px}
  .page.wide .wcol{gap:10px} }
/* chart: grouped participation bars */
.zrow{display:block;width:100%;text-align:start;padding:9px 0;border-top:1px solid var(--line-soft)}
.zrow:first-of-type{border-top:none}
.zhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.zhead b{font-size:calc(13px*var(--ts))}
.zhead span{font-size:calc(11px*var(--ts2));color:var(--muted)}
.zb{display:flex;align-items:center;gap:7px;margin-top:2px}
.ztrack{position:relative;flex:1;height:11px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ztrack i{position:absolute;inset-inline-start:0;top:0;height:100%;border-radius:4px;display:block}
.zb em{font-style:normal;font-size:calc(11px*var(--ts2));font-family:"IBM Plex Mono",monospace;color:var(--ink-2);min-width:34px;text-align:end}
.lgnd{display:flex;gap:14px;flex-wrap:wrap;padding:2px 0 4px}
.lgnd span{display:flex;align-items:center;gap:6px;font-size:calc(11.5px*var(--ts2));color:var(--ink-2)}
.lgnd i{width:10px;height:10px;border-radius:3px;display:block}
/* chat */
.chat{display:flex;flex-direction:column;gap:9px}
.bub{max-width:84%;padding:9px 12px;border-radius:15px;font-size:calc(13.5px*var(--ts));line-height:1.45}
.bub.b{align-self:flex-start;background:var(--surface-2);border-end-start-radius:5px}
.bub.m{align-self:flex-end;background:var(--accent);color:#FBF7F1;border-end-end-radius:5px}
.bub .w{display:block;font-size:calc(10.5px*var(--ts2));opacity:.7;margin-top:3px}
.typing{align-self:flex-start;color:var(--muted);font-size:calc(12px*var(--ts2))}
/* inbox */
.nrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-soft);width:100%;text-align:start}
.nrow:first-of-type{border-top:none}
.nrow .ni{flex:none;width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.nrow .ni svg{width:16px;height:16px}
.nrow .nb{flex:1;min-width:0}
.nrow .nb b{display:block;font-size:calc(13px*var(--ts));line-height:1.3}
.nrow .nb p{margin:2px 0 0;font-size:calc(11.5px*var(--ts2));color:var(--ink-2);line-height:1.4}
.nrow .nb span{font-size:calc(10.5px*var(--ts2));color:var(--muted)}
.nrow .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:11px}
/* sorting guide */
.sg{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-soft)}
.sg:first-of-type{border-top:none}
.sg .tagi{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)}
.sg .tagi svg{width:15px;height:15px}
.sg b{display:block;font-size:calc(13px*var(--ts))}
.sg p{margin:0;font-size:calc(11.5px*var(--ts2));color:var(--ink-2);line-height:1.4}
.sg .no{color:var(--stamp)}
/* carousel */
.carou{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 -16px;padding:2px 16px 2px}
.carou::-webkit-scrollbar{display:none}
.carou>*{flex:0 0 84%;scroll-snap-align:center;margin:0}
.dots{display:flex;gap:5px;justify-content:center;align-items:center;padding-top:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;transition:width .2s,background .2s;cursor:pointer}
.dots i.on{background:var(--accent);width:17px;border-radius:3px}
a.btn{text-decoration:none}
.dots .dnav{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);display:none;place-items:center;flex:none}
.dots .dnav svg{width:14px;height:14px}
.dots .dnav:hover{background:var(--surface-2);color:var(--accent-ink)}
.dots .dnav[disabled]{opacity:.3;pointer-events:none}
.dots .dnav.l{margin-inline-end:6px}
.dots .dnav.r{margin-inline-start:6px}
@media(hover:hover) and (pointer:fine){ .dots .dnav{display:grid} }
.carou.drag{cursor:grab}
.carou.dragging{cursor:grabbing;scroll-snap-type:none}
/* illustrations */
/* the two rates the council is judged on: twice the size of anything else */
/* the round is a list someone scrolls on a doorstep: one line per door */
.drow{display:flex;align-items:stretch;border-top:1px solid var(--line-soft)}
.drow:first-child{border-top:none}
.dmain{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:var(--drowp,7px) 2px;text-align:start;background:none;border:0}
.device[data-ts="2"]{--drowp:5px}
.device[data-ts="3"]{--drowp:3px}
.dav{width:26px;height:26px;border-radius:8px;background:var(--surface-2);color:var(--accent-ink);
  display:grid;place-items:center;font-size:calc(12px*var(--ts2));font-weight:600;flex:none}
.dt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.dt b{font-size:calc(13px*var(--ts));font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt span{font-size:calc(10.5px*var(--ts2));color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;text-align:end}
.dr b{font-size:calc(13px*var(--ts));font-weight:600}
.dr span{font-size:calc(10.5px*var(--ts2));color:var(--muted)}
.dr span.late{color:var(--stamp)}
.dact{width:34px;flex:none;display:grid;place-items:center;border:0;border-inline-start:1px solid var(--line-soft);
  background:none;color:var(--ink-2);text-decoration:none}
.dact svg{width:17px;height:17px}
.dact:active{background:var(--surface-2)}
.dact.skip{width:40px;font-size:calc(9.5px*var(--ts2));font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.heros{display:flex;flex-direction:column;gap:10px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 15px 14px;
  display:flex;flex-direction:column;gap:5px}
.hero .hv{font-family:"Archivo",sans-serif;font-size:calc(44px*var(--ts));font-weight:700;line-height:1;letter-spacing:-.02em;
  color:var(--accent-ink);display:flex;align-items:baseline;gap:2px}
.hero .hv span{font-size:calc(20px*var(--ts));font-weight:600;color:var(--muted)}
.hero .hbar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hero .hbar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hero p.sm{margin:0}
@media(min-width:620px){ .heros{flex-direction:row} .heros>*{flex:1} }
.page.wide .heros{flex-direction:row}
.gmap{display:block;width:100%;height:auto;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-soft)}
.mapwrap{padding:9px 9px 10px;gap:8px}
.mpin:hover circle,.mpin:hover rect{filter:brightness(.94)}
.ill{display:block;width:100%;max-width:360px;margin-inline:auto;height:auto;max-height:118px;
  border-radius:12px;background:var(--surface-2);border:1px solid var(--line-soft)}
.ill.s{max-height:80px}
.ill.xs{max-height:54px}
svg.mico{width:34px;height:34px;flex:none;stroke-width:1.5}
/* a wide column would letterbox a picture into a thin strip, so cap the frame instead */
.page.wide .ill{max-width:300px}
.page.wide .ill.s{max-height:150px}
.page.wide .ill.xs{max-height:96px}
.illrow{display:flex;gap:10px;align-items:center}
.illrow .ill{width:108px;max-height:70px;flex:none}
/* guide sheet */
.gstep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-soft)}
.gstep:first-child{border-top:none}
.gn{flex:none;width:21px;height:21px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);
  display:grid;place-items:center;font-size:calc(11.5px*var(--ts2));font-weight:700;font-family:"Archivo",sans-serif;margin-top:1px}
.gstep b{display:block;font-size:calc(13.5px*var(--ts));margin-bottom:1px}
.gstep p{margin:0}
/* next-collection rows */
.nxt{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft)}
.nxt:first-of-type{border-top:none}
.nxt .ico{flex:none;width:29px;height:29px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.nxt .ico svg{width:17px;height:17px}
.nxt .m{flex:1;min-width:0}
.nxt .m b{display:block;font-size:calc(13.5px*var(--ts));line-height:1.25}
.nxt .m span{display:block;font-size:calc(11.5px*var(--ts2));color:var(--muted)}
.nxt .w{flex:none;text-align:end}
.nxt .w b{display:block;font-size:calc(13px*var(--ts));font-family:"Archivo",sans-serif}
.nxt .w span{display:block;font-size:calc(11px*var(--ts2));color:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <div class="device" id="device">
    <div class="statusbar"><span id="clock">07:12</span>
      <button class="sndtog" id="sndtog" data-a="sound" aria-pressed="false" hidden></button>
      <span id="netstate">baladiservice.com</span></div>
    <div class="addbar" id="addbar" hidden></div>
    <header class="appbar" id="appbar" hidden></header>
    <main class="view" id="view"></main>
    <nav class="tabbar" id="tabbar" hidden></nav>
  </div>
  <aside class="sidecard" id="sidecard"></aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input class="hidden-input" id="hidscan" autocomplete="off" aria-hidden="true" tabindex="-1">
<input class="hidden-input" id="snap" type="file" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">

<script>
"use strict";
/* ============================== data ============================== */
var MINWAGE = 312;              /* USD per month, private-sector minimum wage basis */
var FX = 89500;                 /* LL per USD, rate of record */
var TOWN = "Municipality of Zaytouna";
var DISTRICT = "Keserwan \u00b7 Mount Lebanon";
var DISTRICT_AR = "كسروان \u00b7 جبل لبنان";
/* Reachable before sign-in, because the people who most need help are the ones
   who cannot get in. The number is the municipality's own; set it here. */
/* Every clearance change lands here, newest first, and the administrator can see it. */
/* ============ per-household history, so a record is a record ============
   Deterministic from the account code rather than random, so the same door
   shows the same history every time it is opened, which is what makes a
   screen trustworthy to show from.                                  */
function hsh(str){
  var x=2166136261;
  for(var i=0;i<String(str).length;i++){ x^=String(str).charCodeAt(i); x=Math.imul(x,16777619)>>>0; }
  return x>>>0;
}
function rnd(seed, n){ return (hsh(seed) % n); }
var MONTHS_2026 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct"];
function userPayments(id){
  var d=doorById(id); if(!d) return [];
  var k=hsh(id), out=[], n=2+(k%4);
  var chans=["Bank transfer","OMT or Whish counter","Municipal cashier","Field collector"];
  for(var i=0;i<n;i++){
    var mi = 9 - i*2 - (k>>(i+1))%2; if(mi<0) break;
    var amt = (d.due? d.due : 59.88) / (1 + ((k>>i)%2));
    out.push({ref:payRef(id, 2026, 2-i%2), at:(1+((k>>i)%27))+" "+MONTHS_2026[mi]+" 2026",
              amount:Math.round(amt*100)/100, channel:chans[(k>>i)%chans.length],
              state: i===0 && (k%5===0) ? "awaiting matching" : "recorded"});
  }
  return out;
}
function userTags(id){
  var out=[];
  ["org","rec"].forEach(function(k){
    var book=TAG_BOOK[k];
    Object.keys(book).forEach(function(ser){ if(book[ser].prem===id) out.push(book[ser]); });
  });
  return out.sort(function(a,b){ return a.ser<b.ser?-1:1; });
}
function userEvents(id){
  var d=doorById(id); if(!d) return [];
  var k=hsh(id+"ev"), out=[], n=4+(k%5);
  var kinds=[["Bag collected","p-good"],["Bag collected","p-good"],["Point passed, nothing out","p-neut"],
             ["Bag left — not properly sorted","p-warn"],["Marked down at the facility","p-crit"],
             ["Pickup requested","p-neut"]];
  for(var i=0;i<n;i++){
    var kk=kinds[(k>>i)%kinds.length];
    out.push({what:kk[0], pill:kk[1], at:(1+((k>>(i+2))%27))+" "+MONTHS_2026[9-(i%6)]+" 2026",
              where:d.point, by:["Crew B","Crew A","Driver M-04","Facility gate"][(k>>i)%4]});
  }
  return out;
}
function userStats(id){
  var d=doorById(id), k=hsh(id+"st");
  var bags = 40 + (k%180);
  return {bags:bags, recy:Math.round(bags*0.42), org:Math.round(bags*0.38),
          thisMonth:1+(k%9), since:["Feb","Mar","Apr"][(k%3)]+" 2026",
          qual:62+(k%36), flags:d?d.flags:0, rebate:(1+(k%9))>=REBATE_BAGS};
}
var SKIP_REASONS = ["Access blocked \u2014 vehicle cannot reach",
                    "Nothing out at the point",
                    "Road works or a parked lorry",
                    "Unsafe to stop here now",
                    "Out of time on this round"];
var SKIP_REASONS_AR = ["الوصول مسدود — لا يمكن للمركبة",
                       "لا شيء عند النقطة",
                       "أشغال أو شاحنة متوقفة",
                       "غير آمن للتوقف الآن",
                       "نفد وقت الجولة"];
/* one pictogram per reason, in the same order, so the list can be read by shape */
var SKIP_ICONS = ["blocked","empty","roadworks","alert","clock"];
/* anything reported faulty lands here, with its comment and its photograph */
var FAULTS = [
  {id:"FT-1042", where:"R-14-P", what:"Bin lid broken off", by:"Crew B", at:"9 Oct, 07:12", photo:true,
   note:"Hinge sheared. Bags are going on the ground beside it."},
  {id:"FT-1039", where:"M-17-P", what:"Pad cracked, bin tilting", by:"Driver M-04", at:"6 Oct, 06:48", photo:true,
   note:"Concrete pad has split. It will tip in a storm."}
];
var AUDIT = [
  {at:"14 Sep, 09:41", who:"Marc Aoun", what:"Clearance changed \u00b7 +961 3 946 984 \u00b7 Customer \u2192 Facility operator"},
  {at:"2 Sep, 16:08",  who:"Marc Aoun", what:"Tariff set \u00b7 Restaurants 30.6% \u00b7 within the band"}
];
/* The municipality's own WhatsApp line: the number households message to ask what
   they owe, request a collection or report a missed round. It is also the number
   the one-time codes are sent FROM, so Meta sees one business number and one
   approval rather than two. Separate from SUPPORT.msisdn below, which is the
   number a person calls when the automatic answer is not enough. */
var BALADI_WA = {
  msisdn:  "96171699231",

};
function waUsLink(text){
  return "https://wa.me/" + BALADI_WA.msisdn +
         (text ? "?text=" + encodeURIComponent(text) : "");
}

/* ───────────────────────── the draw, and the law ─────────────────────────
   A prize draw in Lebanon cannot be advertised with a prize that depends on how
   the month goes. The amount has to be fixed and the deposit paid BEFORE anyone
   is told about it. So the pot cannot be "fifty cents times whoever turns up" —
   that figure is not known until the month it would be funding is over.

   The pot is therefore set from the month that has already finished: last
   month's participation and last month's collection decide what this month's
   prize is, the deposit is lodged against that figure, and only then is it
   advertised. A good October pays for a better November.

   It also reads better to a household: the prize is the town's own result,
   handed back. */

function km(aLat,aLon,bLat,bLon){
  var R=6371, dLa=(bLat-aLat)*Math.PI/180, dLo=(bLon-aLon)*Math.PI/180;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(aLat*Math.PI/180)*Math.cos(bLat*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

  if(!S.geo) return null;

}

/* A reference the customer writes in the transfer note. Derived from the
   account and the instalment, so the same bill always produces the same code,
   and ending in a check character so a transposed digit does not land on
   somebody else's account. */
var REF_ALPHABET = "0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";  /* no I or O */
function refCheck(body){
  var n=0;
  for(var i=0;i<body.length;i++) n=(n*31 + body.charCodeAt(i)) % REF_ALPHABET.length;
  return REF_ALPHABET.charAt(n);
}
function payRef(prem, year, seq){
  var body = String(prem||"").replace(/[^0-9A-Za-z]/g,"").toUpperCase() +
             String(year).slice(-2) + String(seq);
  return "BLD-" + body + "-" + refCheck(body);
}
function myRef(){ return payRef(ME.id, 2026, 2); }
function refValid(code){
  var m = /^BLD-([0-9A-Z]+)-([0-9A-Z])$/.exec(String(code||"").trim().toUpperCase());
  return !!m && refCheck(m[1]) === m[2];
}

/* The weekday the cash collector works each zone. A household asking for a
   collector is not asking for a special journey \u2014 it is asking to be on the
   next round that already passes them, which is the only version of this that
   scales past a dozen requests. */
var COLLECTOR_DAY = {D:1, K:2, R:3, M:4, W:5, S:5};   /* 1 = Monday */
var DAY_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var DAY_AR = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

/* Requests to be called on. Each one puts the household on the round for its
   zone and is cleared when the collector takes the cash. */
var CASH_CALLS = [];
function zoneOf(prem){
  var d = doorById(prem);
  if(d && d.point) { var p = placeById(d.point); if(p && p.zone) return p.zone; }
  return String(prem||"").indexOf("-") > 0 ? "D" : "D";
}
/* The next date the collector is in that zone, as a day name and a date. */
function nextCollectorCall(zoneId){
  var want = COLLECTOR_DAY[zoneId] != null ? COLLECTOR_DAY[zoneId] : 1;
  var now = new Date(), d = new Date(now.getTime());
  var add = (want - now.getDay() + 7) % 7;
  /* asked for after 16:00 on the day itself: the round has gone, take the next */
  if(add === 0 && now.getHours() >= 16) add = 7;
  d.setDate(d.getDate() + add);
  return { when: d, dayEn: DAY_EN[want], dayAr: DAY_AR[want],
           dateEn: d.getDate() + " " + ["January","February","March","April","May","June","July",
                                        "August","September","October","November","December"][d.getMonth()],
           days: add };
}
function cashCalled(prem){
  var hit = null;
  CASH_CALLS.forEach(function(c){ if(c.prem === prem && !c.done) hit = c; });
  return hit;
}
function askCollector(prem){
  var open = cashCalled(prem);
  if(open) return open;                      /* asking twice does not mean twice */
  var z = zoneOf(prem), nx = nextCollectorCall(z);
  var c = { prem: prem, zone: z, at: new Date(), due: nx, done: false,
            ref: "CALL-" + String(1000 + CASH_CALLS.length + 1) };
  CASH_CALLS.push(c);
  return c;
}

var BACKEND = {

           (typeof e === "string" ? e : "The register did not answer");
  },

  req:function(path, opts){
    opts = opts || {};
    var hdr = { "apikey": BACKEND.key, "Content-Type":"application/json" };
    if(opts.auth !== false && LIVE.token) hdr["Authorization"] = "Bearer " + LIVE.token;
    if(opts.headers) for(var k in opts.headers) hdr[k]=opts.headers[k];

    }).then(function(r){

  /* The code goes out over WhatsApp, but the auth provider is never told that
     and must not be. Its own "whatsapp" channel is reserved for Twilio, and
     asking for it on a project without Twilio is refused outright. What this
     project has instead is the Send SMS hook: the provider mints, hashes, rate
     limits and expires the code, calls the hook, and the hook delivers it over
     WhatsApp. So the request is an ordinary phone OTP in every respect except
     which wire it goes down, and the verify that follows is type "sms" — the
     only type a phone code has. Sending "whatsapp" here is a sign-in that
     always fails, which is a quiet way to lose every user on day one. */
  channel:"whatsapp",          /* how it is DELIVERED, by the hook */

      body:{phone:e164}});

  loadRecon:function(){
    return Promise.all([
      LIVE.req("/rest/v1/payment_arrival_queue?select=id,received_on,amount_usd,channel,note_as_given,ref_extracted,ref_valid,days_waiting,why&order=received_on.asc"),
      LIVE.req("/rest/v1/payment_unreconciled?select=id,receipt_no,premises_id,amount_usd,channel,external_ref,paid_at,days_waiting,unallocated&order=paid_at.asc")
    ]).then(function(r){
      LIVE.recon = {arrivals:r[0]||[], pending:r[1]||[]};
      return LIVE.recon;
    });
  },
  reconcile:function(paymentId){
    return LIVE.req("/rest/v1/rpc/payment_reconcile", {method:"POST",
      body:{p_payment:paymentId}});
  },

  /* ---- the billing cycle: priced here, issued by an administrator ---- */
  loadRegisterRecon:function(){
    return LIVE.req("/rest/v1/register_reconciliation?select=*")
      .then(function(rows){ LIVE.regrecon = (rows&&rows[0])||null; return LIVE.regrecon; });
  },
  billDry:function(year){
    return LIVE.req("/rest/v1/rpc/bill_year", {method:"POST",
      body:{p_year:year, p_dry_run:true}});
  },

  /* ---- the optimiser's memory, which now outlives the tab ----
     One call returns the decaying average for every stop this role has worked and
     the speed it actually travels at. Empty on a route nobody has run yet, which
     is why the app keeps its own defaults to fall back on. */
  loadLearning:function(role){
    return LIVE.req("/rest/v1/rpc/learning_snapshot", {method:"POST",
      body:{p_role:role}})
      .then(function(snap){
        if(snap && snap.service) LIVE.learning = snap;
        return snap;
      });
  },
  /* the write side of the same loop: what this stop actually cost */
  postStop:function(stop){
    if(!LIVE.on || !LIVE.token || !LIVE.profile) return Promise.resolve(null);
    stop.actor_id = LIVE.profile.id;
    return LIVE.req("/rest/v1/round_stop", {method:"POST", body:stop,
      headers:{"Prefer":"return=representation"}});
  },

  /* ---- is the register reachable at all? anon is granted nothing, so a
         clean refusal is the healthy answer, not an error ---- */
  check:function(){
    LIVE.busy=true;
    return LIVE.req("/rest/v1/zone?select=id&limit=1", {auth:false})
      .then(function(){ LIVE.lastCheck="reachable"; })
      .catch(function(e){
        var m = LIVE.say(e);
        LIVE.lastCheck = /permission|denied|JWT|row-level/i.test(m) ? "reachable" : "unreachable — "+m;
      })
      .then(function(){ LIVE.busy=false; return LIVE.lastCheck; });
  }

function uuid4(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();

    var r=Math.random()*16|0; return (c==="x"?r:((r&0x3)|0x8)).toString(16);
  });
}

function dueNow(){

    var next = LIVE.account.inst.filter(function(i){ return i.seq===2; })[0] || LIVE.account.inst[0];
    return Number(next.amount_usd);
  }
  return myPayable()/2;
}

function shortDate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  return m ? (+m[3]) + " " + MONTHS_SHORT[(+m[2])-1] : String(iso||"");
}
function dueLabel(){
  if(liveOn() && LIVE.account && LIVE.account.inst.length){

/* ---------------- reading it out ----------------
   Half the people who will use this cannot read the screen. A collector on a
   round, a driver closing a load: they know the job, they do not know the words.
   So every instruction, every name and every action on the field screens can be
   spoken, in whichever language the screen is in.

   speechSynthesis is in the browser already — no key, no network, no cost, and
   it keeps working on a round with no signal. Not every handset has an Arabic
   voice installed, so the control hides itself rather than sitting there doing
   nothing when pressed. */
var VOICE = {
  /* Present is not the same as usable. Some embedded browsers expose the property
     and nothing behind it, and a speaker button that does nothing when pressed is
     worse than no button at all for someone who is relying on it. So the test is
     whether speak() is actually a function. An empty voice list is treated
     differently: that is usually the list still loading, not an absence. */
  ok: (function(){
    try{
      return typeof window !== "undefined" && !!window.speechSynthesis &&
             typeof window.speechSynthesis.speak === "function";
    }catch(e){ return false; }
  })(),
  on: true,
  voices: [],
  warmed: false
};
function voiceLoad(){
  if(!VOICE.ok) return;
  try{ VOICE.voices = window.speechSynthesis.getVoices() || []; }catch(e){ VOICE.voices = []; }
}
if(VOICE.ok){
  voiceLoad();
  try{ window.speechSynthesis.onvoiceschanged = voiceLoad; }catch(e){}
}
/* Is there a voice that can actually say this language? An English voice reading
   Arabic is worse than silence — it sounds like nonsense and the listener loses
   confidence in the whole thing. */
function voiceFor(lang){
  if(!VOICE.ok) return null;
  if(!VOICE.voices.length) voiceLoad();
  var want = lang === "ar" ? "ar" : "en";
  var hit = null;
  VOICE.voices.forEach(function(v){
    var L = (v.lang||"").toLowerCase().replace("_","-");
    if(!hit && L.indexOf(want) === 0) hit = v;
  });
  return hit;
}
function canSpeak(){
  if(!VOICE.ok || !VOICE.on) return false;
  /* no voices listed at all usually means the list has not arrived yet rather
     than that there are none, so give it the benefit of the doubt */
  if(!VOICE.voices.length) return true;
  return !!voiceFor(S.ar ? "ar" : "en");
}
function speakStop(){
  if(!VOICE.ok) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  S.saying = null;
}
function speak(text){
  if(!VOICE.ok || !VOICE.on || !text) return false;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    var lang = S.ar ? "ar" : "en";
    var v = voiceFor(lang);
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = lang === "ar" ? "ar-LB" : "en-GB"; }
    /* slower than default: this is an instruction, not a paragraph */
    u.rate = 0.92; u.pitch = 1;
    u.onend = function(){ S.saying = null; markSaying(); };
    u.onerror = function(){ S.saying = null; markSaying(); };
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

   it cannot break the handler, and the same markup works inside any card. */
/* The per-card speakers are gone with the per-control ones: the switch at the
   top covers all of it, and with it on, touching a card reads the card. Kept as
   an empty function rather than deleted so the six views that called it are not
   all edited for a feature that now lives somewhere else entirely. */
function sayBtn(){ return ""; }
function markSaying(){
  var all = document.querySelectorAll(".sayb");
  Array.prototype.forEach.call(all, function(b){
    b.classList.toggle("on", S.saying != null && b.getAttribute("data-say") === S.saying);
  });
}
/* Everything worth hearing on this screen, in order, as one passage. Built from
   the rendered text rather than from a second copy of the words, so it cannot
   drift out of step with what is on the glass. */
function screenSpeech(){
  var v = $("view"); if(!v) return "";
  var bits = [];
  var ttl = document.querySelector("#appbar .ttl");
  if(ttl) bits.push(ttl.textContent.trim());
  Array.prototype.forEach.call(
    v.querySelectorAll("p.h, .big, .card b, .kv, .item .t, .note div, .bigrow span.lab, .btn"),
    function(el){
      var txt = (el.textContent||"").replace(/\s+/g," ").trim();
      if(txt && txt.length < 160 && bits.indexOf(txt) === -1) bits.push(txt);
    });

/* ---------------- Arabic, for the screens that were written in English ----------------
   Most of this app writes its words as English literals inside the markup rather
   than through t(), so the dictionary never saw them. Wrapping four hundred call
   sites would be four hundred chances to break a string; translating the rendered
   text instead is one place, and it cannot miss a screen somebody adds later.

   It replaces a text node only when the WHOLE of it matches a dictionary key
   exactly. No partial matches, no substrings — "Route" inside "Route type" is left
   alone, because a half-translated sentence is worse than an English one.

   Numbers with units are handled separately below: "12 min" is not a phrase to
   translate, it is a number and a word. */
var UNITS = [
  [/\bmin\b/g,        "\u062f"],            /* دقيقة, abbreviated as on a watch face */
  [/\bkm\/h\b/g,      "\u0643\u0645/\u0633"],
  [/\bkm\b/g,         "\u0643\u0645"],
  [/\ban hour\b/g,    "\u0628\u0627\u0644\u0633\u0627\u0639\u0629"],
  [/\bleft\b/g,       "\u0645\u062a\u0628\u0642\u064d"],
  [/\bof\b/g,         "\u0645\u0646"],
  [/\bscans?\b/g,     "\u0645\u0633\u062d"],
  [/\bstops?\b/g,     "\u0645\u062d\u0637\u0627\u062a"],
  [/\bdoors?\b/g,     "\u0623\u0628\u0648\u0627\u0628"],
  [/\bdays?\b/g,      "\u064a\u0648\u0645"],
  [/\bbags?\b/g,      "\u0623\u0643\u064a\u0627\u0633"],
  [/\bin gold\b/g,    "\u0630\u0647\u0628\u0627\u064b"],
  [/\brepeatedly flagged\b/g, "\u0645\u064f\u0628\u0644\u0651\u063a \u0639\u0646\u0647\u0645 \u0645\u0631\u0627\u0631\u0627\u064b"],
  [/\bflags?\b/g,     "\u0628\u0644\u0627\u063a\u0627\u062a"],
  [/\bqueued\b/g,    "\u0641\u064a \u0627\u0644\u0637\u0627\u0628\u0648\u0631"],
  [/\boptimised\b/g, "\u0645\u064f\u062d\u0633\u0651\u064e\u0646"],
  [/\bsaved\b/g,     "\u0645\u0648\u0641\u0651\u0631\u0629"],
  [/\bhere\b/g,      "\u0647\u0646\u0627"]

function arUnits(txt){
  /* only where the string is a number followed by a unit, so prose is untouched */
  /* a data string either starts with a number, or is a short phrase built around
     one \u2014 "optimised · 13 min saved". Prose is excluded by the length. */
  if(!/\d/.test(txt)) return null;
  if(txt.length > 46) return null;
  var out = txt, hit = false;
  UNITS.forEach(function(u){ if(u[0].test(out)){ out = out.replace(u[0], u[1]); hit = true; } });
  return hit ? out : null;
}
function translateDom(root){
  if(!S.ar) return;
  var v = root || $("view"); if(!v) return;
  var w = document.createTreeWalker(v, NodeFilter.SHOW_TEXT, null, false);
  var n, hits = [];
  while((n = w.nextNode())){
    var raw = n.nodeValue;
    var key = raw.replace(/\s+/g, " ").trim();
    if(key.length < 2) continue;
    if(!/[A-Za-z]/.test(key)) continue;
    var to = AR[key] || arUnits(key);
    if(to) hits.push([n, raw.replace(key, to)]);
  }
  hits.forEach(function(x){ x[0].nodeValue = x[1]; });
  /* the words that are not text nodes: what a box says before it is filled in,
     and what a control tells a screen reader it is */
  ["placeholder","aria-label","title"].forEach(function(at){
    Array.prototype.forEach.call(v.querySelectorAll("["+at+"]"), function(el){
      var raw = el.getAttribute(at) || "";
      var key = raw.replace(/\s+/g, " ").trim();
      if(key.length < 2 || !/[A-Za-z]/.test(key)) return;
      var to = AR[key] || arUnits(key);
      if(to) el.setAttribute(at, to);
    });
  });
}

/* ---------------- sound: read it first, then do it ----------------
   The earlier design hung a small speaker on every control. It worked, and it
   was wrong: forty speakers on a screen is forty more things to understand,
   and the one thing a person who cannot read does not need is more icons.

   This is the whole feature instead. One switch at the top. With it on, the
   first touch on anything says what it is, and the second touch does it. With
   it off, everything behaves exactly as it always did \u2014 so a reader is
   never slowed down by a feature built for somebody else.

   The arming is per control and short-lived: touch something else, or wait,
   and the first touch rule applies again. That matters because the second
   touch is a real press, and "Close the shift" is not a thing to do by
   accident. */

     so the screen has to be redrawn and not just the switch repainted. */

function wireCarou(){
  var pgw=document.querySelector(".page");
  /* in desktop mode the cards are all on show, so there is nothing to scroll */
  if(pgw && pgw.classList.contains("wide") && window.innerWidth>1000) return;
  var list=document.querySelectorAll(".carou");
  [].forEach.call(list, function(el){
    var dots = el.nextElementSibling;
    if(!dots || !dots.classList || !dots.classList.contains("dots")) dots=null;
    var pips = dots ? dots.querySelectorAll("i") : [];
    var nav  = dots ? dots.querySelectorAll(".dnav") : [];
    var n=el.children.length;
    var step=function(){ return el.scrollWidth/Math.max(1,el.children.length); };
    var idx=function(){
      var i=Math.round(Math.abs(el.scrollLeft)/Math.max(1,step()));
      return i>n-1 ? n-1 : (i<0?0:i);
    };
    var upd=function(){
      if(!n) return;
      var i=idx();
      [].forEach.call(pips,function(d,j){ d.classList.toggle("on", j===i); });
      [].forEach.call(nav,function(b){
        var d=+b.getAttribute("data-c");
        if(d<0) b.disabled = (i<=0); else b.disabled = (i>=n-1);
      });
    };
    var go=function(i){
      if(i<0) i=0; if(i>n-1) i=n-1;
      var dir = (getComputedStyle(el).direction==="rtl") ? -1 : 1;
      el.scrollTo({left: dir*i*step(), behavior:"smooth"});
    };
    el.addEventListener("scroll", upd, {passive:true});
    [].forEach.call(pips,function(d,j){ d.addEventListener("click",function(){ go(j); }); });
    [].forEach.call(nav,function(b){ b.addEventListener("click",function(ev){
      ev.preventDefault(); go(idx() + (+b.getAttribute("data-c")));
    }); });
    /* a mouse has no swipe, so the cards can be dragged */
    if(window.matchMedia && window.matchMedia("(pointer:fine)").matches){
      el.classList.add("drag");
      var down=false, sx=0, sl=0, moved=0;
      el.addEventListener("mousedown", function(ev){
        if(ev.button) return;
        down=true; moved=0; sx=ev.clientX; sl=el.scrollLeft; el.classList.add("dragging");
      });
      window.addEventListener("mousemove", function(ev){
        if(!down) return;
        var d=ev.clientX-sx; if(Math.abs(d)>3) moved=1;
        el.scrollLeft = sl - d; ev.preventDefault();
      });
      window.addEventListener("mouseup", function(){
        if(!down) return;
        down=false; el.classList.remove("dragging");
        if(moved) go(idx());
      });
      el.addEventListener("click", function(ev){ if(moved){ ev.preventDefault(); ev.stopPropagation(); moved=0; } }, true);
    }
    upd();
  });
}

/* Desktop puts several columns side by side. CSS multi-column fragments a card
   mid-scroll, which broke the carousels, so the columns are built and filled by
   measurement instead: each block lands in whichever column is shortest. */
function layoutWide(){
  var v=$("view"); if(!v) return;
  var pg=document.querySelector(".page");
  if(!pg || !pg.classList.contains("wide")) return;
  if(v.classList.contains("login")) return;
  v.classList.remove("cols");
  var w=v.clientWidth;
  var cap = w>=1040 ? 3 : (w>=720 ? 2 : 1);
  var kids=[].slice.call(v.children); if(kids.length<3) return;
  /* Each block places on its own, except a heading, which keeps the block under it. */
  var groups=[], gi=0;
  while(gi<kids.length){
    var el=kids[gi];
    var sect = el.classList && (el.classList.contains("sect") || el.classList.contains("wbreak"));
    if(sect && gi+1<kids.length){ groups.push([el,kids[gi+1]]); gi+=2; }
    else { groups.push([el]); gi++; }
  }
  if(groups.length<2) return;
  /* Measure the blocks as they would stack, not as the row they are sitting in. */
  var prev=v.style.flexDirection; v.style.flexDirection="column";
  var gh=groups.map(function(g){
    var hsum=0; g.forEach(function(el){ hsum+=el.offsetHeight; });
    return hsum + (g.length-1)*13;
  });
  v.style.flexDirection=prev;
  var total=0; gh.forEach(function(x){ total+=x+13; });
  /* Columns are chosen by how much there is to show, not by how wide the glass is.
     Three stubby columns above a field of nothing is worse than one honest one. */
  var avail = v.clientHeight || 760;
  var cn = Math.max(1, Math.min(cap, groups.length, Math.ceil(total/(avail*0.92))));
  if(cn<2) return;
  v.classList.add("cols");
  var cols=[];
  for(var i=0;i<cn;i++){ var c=document.createElement("div"); c.className="wcol"; v.appendChild(c); cols.push(c); }
  /* Newspaper balance: keep reading order, break a column when the block that would
     straddle the boundary sits more than half past it. */
  var target=total/cn, acc=0, ci=0;
  groups.forEach(function(g,i){
    if(ci<cn-1 && acc>0 && acc + gh[i]/2 > target*(ci+1)) ci++;
    g.forEach(function(el){ cols[ci].appendChild(el); });
    acc += gh[i]+13;
  });
  /* an empty column reads as a mistake */
  for(var j=cols.length-1;j>=0;j--){ if(!cols[j].children.length) v.removeChild(cols.splice(j,1)[0]); }
  if(!cols.length) v.classList.remove("cols");
}

var cam = {stream:null, raf:null, det:null};
function stopCam(){

  if(cam.stream){ cam.stream.getTracks().forEach(function(t){ t.stop(); }); cam.stream=null; }

function camWhy(e){
  var n = (e && e.name) || "";
  if(location.protocol==="file:")
    return "A page opened straight from a file cannot use the camera. Put the app on baladiservice.com, or press Photograph the code below — that works everywhere.";
  if(!window.isSecureContext)
    return "The live camera needs an https address. Press Photograph the code below, or use the handheld scanner.";
  if(window.self!==window.top)
    return "This preview frame does not pass the camera through. Open the app on its own address, or press Photograph the code below.";
  if(n==="NotAllowedError"||n==="SecurityError")
    return "Camera permission was refused. Allow it from the padlock in the address bar, then try again — or press Photograph the code below.";
  if(n==="NotFoundError"||n==="OverconstrainedError") return "No camera was found on this device.";
  if(n==="NotReadableError") return "The camera is being used by another app. Close it and try again.";
  return "The live camera would not start here. Press Photograph the code below, or use the handheld scanner.";
}
function decodeImageFile(file){
  if(!file) return;
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var max=1000, sc=Math.min(1, max/Math.max(img.width,img.height));
    var w=Math.round(img.width*sc), hh=Math.round(img.height*sc);
    var cv=document.createElement("canvas"); cv.width=w; cv.height=hh;
    var ctx=cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,hh);
    URL.revokeObjectURL(url);
    var done=function(val){ if(val){ onScan(val,"photo"); } else {
      S.camErr="No code found in that photograph. Fill the frame with the code and try again."; paint(); } };
    if("BarcodeDetector" in window){
      try{ new window.BarcodeDetector({formats:["qr_code"]}).detect(cv)
        .then(function(r){ done(r && r.length ? r[0].rawValue : fallbackDecode(ctx,w,hh)); })
        .catch(function(){ done(fallbackDecode(ctx,w,hh)); }); return; }catch(e){}
    }
    done(fallbackDecode(ctx,w,hh));
  };
  img.onerror=function(){ S.camErr="That file could not be read as an image."; paint(); };
  img.src=url;
}
function fallbackDecode(ctx,w,hh){
  if(typeof jsQR!=="function") return null;
  var d=ctx.getImageData(0,0,w,hh);
  var r=jsQR(d.data,w,hh,{inversionAttempts:"attemptBoth"});
  return r && r.data ? r.data : null;
}
function startCam(){
  var v=$("camvid"), cv=$("camcan");
  if(!v) return;
  S.camErr="";
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || location.protocol==="file:" || !window.isSecureContext){
    S.camErr=camWhy({name:"insecure"}); paint(); return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){
    cam.stream=st; v.srcObject=st; v.setAttribute("playsinline",""); v.play();
    S.camOn=true; var ss=$("scanstate"); if(ss) ss.innerHTML='<i class="dotlive"></i>'+h(t("Camera"))+' · '+h(t("Waiting for a scan"));
    if(S.camPhoto){ paint(); return; }
    if("BarcodeDetector" in window){
      try{ cam.det=new window.BarcodeDetector({formats:["qr_code"]}); }catch(e){ cam.det=null; }
    }
    loop();
  }).catch(function(e1){
    navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(function(st){
      cam.stream=st; v.srcObject=st; v.setAttribute("playsinline",""); v.play(); S.camOn=true;
      if(S.camPhoto){ paint(); return; }
      if("BarcodeDetector" in window){ try{ cam.det=new window.BarcodeDetector({formats:["qr_code"]}); }catch(e){ cam.det=null; } }
      loop();
    }).catch(function(e2){ S.camErr=camWhy(e2||e1); paint(); });
  });
  function loop(){
    cam.raf=requestAnimationFrame(loop);
    if(!v.videoWidth) return;
    if(cam.det){
      if(loop.busy) return; loop.busy=true;
      cam.det.detect(v).then(function(r){ loop.busy=false; if(r && r.length) onScan(r[0].rawValue,"camera"); })
        .catch(function(){ loop.busy=false; cam.det=null; });
      return;
    }
    if(typeof jsQR!=="function") return;
    var w=320, hh=Math.round(v.videoHeight/v.videoWidth*320);
    cv.width=w; cv.height=hh;
    var ctx=cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(v,0,0,w,hh);
    var d=ctx.getImageData(0,0,w,hh);
    var res=jsQR(d.data,w,hh,{inversionAttempts:"dontInvert"});
    if(res && res.data) onScan(res.data,"camera");
  }
}

/* Four grammars, plus a bare serial, because that is what is printed on the
   sheet and what a hand-typed entry looks like. A bag resolves to a household;
   a place resolves to a position on the map. */
/* The grammars actually printed on the tags:
     bbo<serial>                   organic bag
     bbr<serial>                   recyclables bag
     BALADI:COLLECTION:<serial>    collection point
     BALADI:DROP_OFF:<serial>      drop-off point
   plus the older forms, and a bare serial, because that is what someone types
   when a tag will not read. Separators are forgiving; case is not significant. */
function parseCode(raw){
  var s=String(raw||"").trim(), m;
  var flat = s.replace(/[\s_\-]/g,"").toUpperCase();

  /* bags: bbo / bbr, however they are punctuated */
  if((m=/^BB([OR]):?(\d{1,12})$/.exec(flat)))
    return tagFor(m[1]==="O"?"org":"rec", m[2].padStart(8,"0"), s, true);
  if((m=/^BALADI:?BAG(?:ORGANIC|ORG):?([0-9]{1,12})$/.exec(flat)))
    return tagFor("org", m[1].padStart(8,"0"), s, true);
  if((m=/^BALADI:?BAG(?:RECYCLE|RECY|REC):?([0-9]{1,12})$/.exec(flat)))
    return tagFor("rec", m[1].padStart(8,"0"), s, true);

  /* places: a serial against the printed sequence for that type */
  if((m=/^BALADI:?(?:COLLECTIONPOINT|COLLECTION|CP):?(\d{1,12})$/.exec(flat))){
    var pc=placeBySerial("cp", m[1]);
    return tagFor("cp", pc? pc.id : m[1].padStart(8,"0"), s, !!pc);
  }
  if((m=/^BALADI:?(?:DROPOFF|DROP|DOP):?(\d{1,12})$/.exec(flat))){
    var pd=placeBySerial("dop", m[1]);
    return tagFor("dop", pd? pd.id : m[1].padStart(8,"0"), s, !!pd);
  }

  /* the named forms, and the human codes themselves */
  if((m=/^baladi:(org|rec|cp|dop):([A-Za-z0-9\-_]+)$/i.exec(s))){
    var k=m[1].toLowerCase(), id=m[2];
    return tagFor(k, k==="org"||k==="rec" ? String(id).padStart(8,"0") : id.toUpperCase(), s, true);
  }
  if((m=/^baladi:bag:(\d{1,12})$/i.exec(s))){
    var ser=m[1].padStart(8,"0");
    return tagFor(parseInt(ser,10)%2 ? "org" : "rec", ser, s, true);
  }
  if((m=/^baladi:point:([A-Za-z0-9\-_]+)$/i.exec(s))){
    var pid=m[1].toUpperCase(), pl=placeById(pid);
    return tagFor(pl && pl.type==="dop" ? "dop" : "cp", pid, s, !!pl);
  }
  if(/^ST-?\d+$/i.test(s))                      return tagFor("dop", s.toUpperCase(), s, !!placeById(s.toUpperCase()));
  if(/^[A-Z]{1,3}-?\d{1,3}-?P$/i.test(s))       return tagFor("cp",  s.toUpperCase(), s, !!placeById(s.toUpperCase()));

  /* a bare serial off the bag sheet */
  /* a bare serial cannot say which book it came from: prefix it to be sure */
  if(/^\d{1,12}$/.test(s)){
    var ser2=s.padStart(8,"0"), o=tagFor("org", ser2, s, !!tagBySerial("org", ser2));
    o.ambiguous = true;
    return o;
  }
  if(/^BG-/i.test(s)) return tagFor("org", s, s, false);
  return {kind:"unknown", thing:"unknown", id:s, raw:s, known:false};
}
function tagFor(kind, id, raw, known){
  var K = TAGKIND[kind] || TAGKIND.cp;
  var o = {kind:kind, thing:K.thing, id:id, raw:raw, known:!!known, stream:K.stream};
  if(K.thing==="bag"){
    var bk=tagBySerial(kind, id);
    o.prem = bk ? bk.prem : null;
    o.state = bk ? bk.state : "unknown";
    o.door = o.prem ? doorById(o.prem) : null;
  } else {
    o.place = placeById(id);
    o.lat = o.place ? o.place.lat : null;
    o.lon = o.place ? o.place.lon : null;
  }
  return o;
}
function doorById(id){ var h=null; ROUTE_DOORS.forEach(function(d){ if(d.id===id) h=d; }); return h; }
function codeLabel(p){
  var K=TAGKIND[p.kind];
  if(!K) return t("Unrecognised code");
  if(K.thing==="bag")  return (S.ar?K.ar:K.en)+" "+p.id;
  return (S.ar?K.ar:K.en)+" "+p.id;
}
/* what the thing behind the tag actually is, in one line */
function codeSubject(p){
  if(!TAGKIND[p.kind]) return "";
  if(p.thing==="bag"){
    if(p.door) return p.door.n+" \u00b7 "+p.prem;
    return p.state==="printed" ? "printed, not yet issued" : "serial not on the register";
  }
  return p.place ? (S.ar?p.place.ar:p.place.en)+" \u00b7 "+p.place.zone : "place not on the register";
}
function onScan(raw, src){
  var code=String(raw).trim();
  if(!code) return;
  if(S.lastScan && S.lastScan.code===code && Date.now()-S.lastScan.at<2500) return;
  S.lastScan={code:code, at:Date.now(), src:src};
  /* nothing logged means nothing was wrong: a bag is assumed sorted, a point assumed clear */
  var P0=parseCode(code);
  S.scanRank    = P0.thing==="bag" ? "ok" : null;
  S.scanOutcome = P0.thing==="bag" ? BAG_OUTCOMES[0]
                : P0.kind==="dop"  ? DOP_OUTCOMES[0]
                : POINT_OUTCOMES[0];
  S.scanTouched = false;
  if(navigator.vibrate) try{ navigator.vibrate(35); }catch(e){}
  stopCam();
  S.scansSinceCheck++;
  if(S.role==="facility"){
    if(S.session){
      var dup=false;
      S.session.scans.forEach(function(x){ if(x.code===code) dup=true; });
      if(dup){ toast("Already marked down in this session"); paint(); return; }
      var d=new Date();
      S.session.scans.push({code:code, at:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")});
      toast("Marked down for contamination \u00b7 "+code);
    } else toast("Start a sampling session first");
    paint(); return;
  }
  if(S.role==="collector"){
    var dd=doorByCode(code);
    stopCam(); push("door", dd.id);
    toast("Opened "+dd.n+" \u00b7 "+dd.id);
    return;
  }
  if(S.role==="customer" && S.pickScan){
    S.pickTag=code; S.pickScan=false; paint();
    toast("Tag attached to the request"); return;
  }
  if(S.role==="customer") push("bagscanned",code);
  else if(S.role==="collector") push("scanned",code);
  else push("scanned",code);
}
