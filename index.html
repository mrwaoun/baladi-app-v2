function digits(s){ return String(s||"").replace(/\D/g,""); }
/* strip a pasted country code, a leading 00 and the national trunk 0 */
function localPart(cc, raw){
  var d=digits(raw);
  if(d.indexOf("00")===0) d=d.slice(2);
  if(d.indexOf(cc)===0 && d.length>cc.length) d=d.slice(cc.length);
  while(d.indexOf("0")===0) d=d.slice(1);
  return d;
}
function findNumber(cc, raw){
  var d=localPart(cc, raw), hit=null;
  REGISTER.forEach(function(r){ if(r.cc===cc && r.n===d) hit=r; });
  return hit;
}
function phoneOk(s){ return !!findNumber(S.cc||"961", s); }
/* The signed-in number is a household on the register, so the customer screens
   show that household rather than a stand-in. */
function bindCustomer(ent){
  if(!ent || !ent.prem) return;
  var d=null; ROUTE_DOORS.forEach(function(x){ if(x.id===ent.prem) d=x; });
  if(!d) return;
  ME.id=d.id; ME.name=ent.name; ME.nameAr=d.ar; ME.addr=d.a; ME.point=d.point;
  ME.msisdn=d.msisdn; ME.cat = d.id.charAt(0)==="B" ? "bak" : "res";
  ME.exempt = d.st==="exempt";
}
/* ---- the gate, when the app is running self-contained ----
   Two things have to be true to get in: the number is on the register, and the
   access code matches. The code is SHARED, not secret \u2014 it sits in this file,
   so anyone who reads the page can find it. It keeps a passer-by out of a
   working session; it is not authentication, and the screen does not claim it
   is. Real verification is the live path, where the provider issues and checks
   a one-time code per number and the browser never sees it. */
var ACCESS_CODE = "680646";
/* An interim with no end date is a permanent arrangement nobody decided on. This
   is the date the shared code stops working, and the sign-in screen says so out
   loud so it cannot quietly outlive the thing it is standing in for. Move it if
   the provider takes longer; do not remove it. */
var ACCESS_CODE_UNTIL = "2026-12-31";
function codeExpired(){
  var today = new Date();
  var iso = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+
            "-"+String(today.getDate()).padStart(2,"0");
  return iso > ACCESS_CODE_UNTIL;
}
function untilText(){
  var d = new Date(ACCESS_CODE_UNTIL+"T00:00:00");
  var m = ["January","February","March","April","May","June","July",
           "August","September","October","November","December"][d.getMonth()];
  return d.getDate()+" "+m+" "+d.getFullYear();
}
/* Two things have to be true, and a third has to be false. The number is on the
   register, the code matches, and the shared code has not expired.

   Note what this function is NOT reachable from: when LIVE.on is true the
   sign-in handler never calls it at all — it goes to the provider instead. That
   is the part that matters. The shared code cannot be used against real
   household records, not because anyone remembers to turn it off, but because
   the branch that reads it is not on that path. */
function codeOk(entry, code){
  return !!entry && !codeExpired() && digits(code) === ACCESS_CODE;
}
/* One line that says which register is answering. Silent when self-contained,
   because that is the normal state and nobody needs telling. */
/* The code goes to the number itself, so say which number, without printing
   the whole of it on a screen someone else may be looking at. */
function maskNum(cc, local){
  var d=String(local||"").replace(/\D/g,"");
  if(d.length<4) return "+"+cc+" "+d;
  return "+"+cc+" "+d.slice(0,2)+"\u00b7\u00b7\u00b7"+d.slice(-3);
}

    return '<div class="note g"><span>'+svg("check")+'</span><div><b>'+
      h(t("A collector will call on you"))+'</b>'+

      '</div></div>'+
      '<div class="card plain"><div class="kv" style="border:none"><span>'+h(t("Your call reference"))+

/* ===================== the map =====================
   Drawn here, from the coordinates the register already holds. No tile
   provider, no key, no billing account, nothing to meter \u2014 and it works on a
   round with no signal, which a tiled map does not. It uses the app\u2019s own
   type and palette, so it reads as part of the app rather than a window onto
   somebody else\u2019s. Turn-by-turn is a job for the phone\u2019s own map, so each
   pin offers a link out to it.
   Tiles can be layered underneath later without changing any caller.        */
var MAPW = 640, MAPH = 370, MAPPAD = 30;

function mapProject(pts){
  var lats=pts.map(function(p){return p.lat;}), lons=pts.map(function(p){return p.lon;});
  var la0=Math.min.apply(null,lats), la1=Math.max.apply(null,lats);
  var lo0=Math.min.apply(null,lons), lo1=Math.max.apply(null,lons);
  if(la1-la0 < 0.004){ var mc=(la0+la1)/2; la0=mc-0.002; la1=mc+0.002; }
  if(lo1-lo0 < 0.004){ var nc=(lo0+lo1)/2; lo0=nc-0.002; lo1=nc+0.002; }
  /* longitude degrees are shorter than latitude degrees this far north */
  var kx=Math.cos((la0+la1)/2*Math.PI/180);
  var w=(lo1-lo0)*kx, hh=(la1-la0);
  var sc=Math.min((MAPW-2*MAPPAD)/w, (MAPH-2*MAPPAD)/hh);
  var ox=(MAPW-w*sc)/2, oy=(MAPH-hh*sc)/2;
  return {
    x:function(lon){ return ox + (lon-lo0)*kx*sc; },
    y:function(lat){ return MAPH - (oy + (lat-la0)*sc); },
    /* the inverse, so a terrain model can be sampled per pixel */
    lon:function(x){ return lo0 + (x-ox)/(kx*sc); },
    lat:function(y){ return la0 + ((MAPH-y)-oy)/sc; },
    scale:sc, kx:kx,
    /* metres per pixel, for an honest scale bar */
    mpp:function(){ return 111320/sc; }
  };
}
var PINCOL = {
  todo:  {fill:"var(--surface)",     line:"var(--accent)",    txt:"var(--accent-ink)"},
  done:  {fill:"var(--good)",        line:"var(--surface)",   txt:"var(--surface)"},
  issue: {fill:"var(--stamp)",       line:"var(--surface)",   txt:"var(--surface)"},
  skip:  {fill:"var(--surface-2)",   line:"var(--muted)",     txt:"var(--muted)"},
  dop:   {fill:"var(--gold-soft)",   line:"var(--gold)",      txt:"var(--gold)"},
  me:    {fill:"var(--accent-ink)",  line:"var(--surface)",   txt:"var(--surface)"}
};
/* ---- the ground itself ----
   Zaytouna sits on a slope: the lower road near the highway is around 90 m, the
   saha 230 m, the Harissa road climbs past 330 m, and Wadi al-Karm cuts a
   valley through the south-east. That is a model, not a survey, but it is the
   real shape of the place and it is what makes a route map legible: a crew can
   see which stops are uphill.                                                */
function elevAt(lat, lon){
  var e = 230 + (lat - 33.9500)*111320*0.129 - (lon - 35.6334)*92000*0.045;
  /* the wadi */
  var dw = Math.hypot((lat-33.9442)*111320, (lon-35.6344)*92000);
  e -= 46 * Math.exp(-(dw*dw)/(2*330*330));
  /* the knoll above the church */
  var dk = Math.hypot((lat-33.9538)*111320, (lon-35.6338)*92000);
  e += 24 * Math.exp(-(dk*dk)/(2*240*240));
  return e;
}
/* marching squares over the model, so the lines are computed rather than drawn */
function contourPaths(pr, lo, hi, step, cols, rows){
  var segs={}, g=[], i, j;
  for(j=0;j<=rows;j++){
    g[j]=[];
    for(i=0;i<=cols;i++){
      var x=i*(MAPW/cols), y=j*(MAPH/rows);
      g[j][i]={x:x, y:y, v:elevAt(pr.lat(y), pr.lon(x))};
    }
  }
  function ip(a,b,lv){
    var t=(lv-a.v)/((b.v-a.v)||1e-9);
    return [a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t];
  }
  for(var lv=Math.ceil(lo/step)*step; lv<=hi; lv+=step){
    var d="";
    for(j=0;j<rows;j++) for(i=0;i<cols;i++){
      var tl=g[j][i], tr=g[j][i+1], br=g[j+1][i+1], bl=g[j+1][i];
      var k=(tl.v>lv?8:0)|(tr.v>lv?4:0)|(br.v>lv?2:0)|(bl.v>lv?1:0);
      if(k===0||k===15) continue;
      var a=null,b=null;
      var T=ip(tl,tr,lv), R=ip(tr,br,lv), B=ip(bl,br,lv), L=ip(tl,bl,lv);
      if(k===1||k===14){a=L;b=B;} else if(k===2||k===13){a=B;b=R;}
      else if(k===3||k===12){a=L;b=R;} else if(k===4||k===11){a=T;b=R;}
      else if(k===6||k===9){a=T;b=B;}  else if(k===7||k===8){a=L;b=T;}
      else if(k===5){a=L;b=T;} else if(k===10){a=T;b=R;}
      if(a&&b) d+="M"+a[0].toFixed(1)+" "+a[1].toFixed(1)+"L"+b[0].toFixed(1)+" "+b[1].toFixed(1);
    }
    if(d) segs[lv]=d;
  }
  return segs;
}
var contourStep = 25;
function contourLayer(pr){
  var lo=1e9, hi=-1e9;
  [[0,0],[MAPW,0],[0,MAPH],[MAPW,MAPH],[MAPW/2,MAPH/2]].forEach(function(q){
    var e=elevAt(pr.lat(q[1]), pr.lon(q[0]));
    if(e<lo) lo=e; if(e>hi) hi=e;
  });
  var span=hi-lo, step = span>700 ? 50 : (span>280 ? 25 : (span>120 ? 20 : 10));
  contourStep = step;
  var segs=contourPaths(pr, lo, hi, step, 48, 34), out='';
  Object.keys(segs).forEach(function(lv){
    var major = (Number(lv) % (step*4) === 0);
    out += '<path d="'+segs[lv]+'" fill="none" stroke="var(--ink-2)" '+
           'stroke-opacity="'+(major?".26":".13")+'" stroke-width="'+(major?1.6:1)+'" '+
           'stroke-linecap="round"/>';
  });
  return '<g class="contours">'+out+'</g>';
}
function mapScaleBar(pr){
  var target=120, metres=target*pr.mpp();
  var nice=[50,100,200,250,500,1000,2000], pick=nice[0];
  nice.forEach(function(n){ if(Math.abs(n-metres) < Math.abs(pick-metres)) pick=n; });
  var px=pick/pr.mpp();
  return '<g transform="translate(18,'+(MAPH-20)+')">'+
    '<path d="M0 0h'+px.toFixed(0)+'" stroke="var(--ink-2)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<path d="M0 -5v10M'+px.toFixed(0)+' -5v10" stroke="var(--ink-2)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<text x="'+(px/2).toFixed(0)+'" y="-9" text-anchor="middle" font-family="IBM Plex Mono, monospace" '+
    'font-size="15" fill="var(--ink-2)" direction="ltr" style="direction:ltr;unicode-bidi:isolate">'+
      (pick>=1000 ? (pick/1000)+" km" : pick+" m")+'</text></g>';
}

/* stops: [{id,lat,lon,label,state,kind,n}] — state is a key of PINCOL */
function mapSvg(stops, opts){
  opts = opts || {};
  var all = stops.slice();
  if(opts.me) all = all.concat([{lat:opts.me.lat, lon:opts.me.lon}]);
  if(!all.length) return '';
  var pr = mapProject(all), out='';

  out += '<rect width="'+MAPW+'" height="'+MAPH+'" fill="var(--surface-2)"/>';
  out += contourLayer(pr);

  /* the route, in the order it will be worked */
  if(opts.route && stops.length>1){
    var d = stops.map(function(p,i){ return (i?"L":"M")+pr.x(p.lon).toFixed(1)+" "+pr.y(p.lat).toFixed(1); }).join("");
    out += '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-opacity=".32" stroke-width="7" '+
           'stroke-linejoin="round" stroke-linecap="round"/>';
    var dd = stops.filter(function(p){ return p.state==="done"; });
    if(dd.length>1){
      var d2 = dd.map(function(p,i){ return (i?"L":"M")+pr.x(p.lon).toFixed(1)+" "+pr.y(p.lat).toFixed(1); }).join("");
      out += '<path d="'+d2+'" fill="none" stroke="var(--good)" stroke-opacity=".55" stroke-width="7" '+
             'stroke-linejoin="round" stroke-linecap="round"/>';
    }
  }

  stops.forEach(function(p,i){
    var c = PINCOL[p.state] || PINCOL.todo;
    var x = pr.x(p.lon), y = pr.y(p.lat);
    var r = p.kind==="dop" ? 17 : 15;
    out += '<g class="mpin" data-a="mappin" data-v="'+h(p.id||"")+'" style="cursor:pointer">';
    if(p.kind==="dop")
      out += '<rect x="'+(x-r).toFixed(1)+'" y="'+(y-r).toFixed(1)+'" width="'+(r*2)+'" height="'+(r*2)+
             '" rx="5" fill="'+c.fill+'" stroke="'+c.line+'" stroke-width="3"/>';
    else
      out += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="'+c.fill+
             '" stroke="'+c.line+'" stroke-width="3"/>';
    if(p.state==="done")
      out += '<path d="M'+(x-6).toFixed(1)+' '+y.toFixed(1)+'l4 4 7-8" fill="none" stroke="'+c.txt+
             '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    else if(p.state==="issue")
      out += '<path d="M'+x.toFixed(1)+' '+(y-6).toFixed(1)+'v7M'+x.toFixed(1)+' '+(y+5).toFixed(1)+'v1" '+
             'stroke="'+c.txt+'" stroke-width="3" stroke-linecap="round"/>';
    else
      out += '<text x="'+x.toFixed(1)+'" y="'+(y+5).toFixed(1)+'" text-anchor="middle" '+
             'font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500" fill="'+c.txt+'">'+
             (p.n!=null ? p.n : "")+'</text>';
    out += '</g>';
  });

  /* where you are, as a pin rather than a dot, with its accuracy drawn honestly */
  if(opts.me){
    var mx=pr.x(opts.me.lon), my=pr.y(opts.me.lat);
    if(opts.me.acc){
      var ar = Math.max(10, Math.min(90, opts.me.acc / pr.mpp()));
      out += '<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="'+ar.toFixed(0)+
             '" fill="var(--accent)" opacity=".12" stroke="var(--accent)" stroke-opacity=".3" stroke-width="1.5"/>';
    }
    out += '<g transform="translate('+mx.toFixed(1)+','+my.toFixed(1)+')">'+
      '<path d="M0 4c0 0 13-12 13-21A13 13 0 0 0-13-17c0 9 13 21 13 21z" fill="'+PINCOL.me.fill+
        '" stroke="'+PINCOL.me.line+'" stroke-width="2.5" stroke-linejoin="round"/>'+
      '<circle cx="0" cy="-17" r="4.5" fill="'+PINCOL.me.line+'"/>'+
      '<ellipse cx="0" cy="6" rx="6" ry="2.2" fill="var(--ink-2)" opacity=".25"/></g>';
  }
  out += mapScaleBar(pr);
  return '<svg class="gmap" viewBox="0 0 '+MAPW+' '+MAPH+'" role="img" aria-label="'+
    h(opts.alt||"Map of the round")+'">'+out+'</svg>';
}

function mapLegend(items){
  return '<div class="lgnd">'+items.map(function(it){
    var c=PINCOL[it[0]]||PINCOL.todo;
    return '<span><i style="background:'+c.fill+';border:2px solid '+c.line+';width:12px;height:12px;'+
      (it[0]==="dop"?"border-radius:3px":"border-radius:50%")+'"></i>'+h(it[1])+'</span>';
  }).join("")+'</div>';
}
/* Turn-by-turn belongs to the phone's own map, which costs nothing and is
   already installed. A single destination for one pin; the whole rest of the
   round, in order, when the driver wants the lot. Google takes nine waypoints
   plus a destination, so the run is capped at ten stops and says so. */
var MAPS_MAX_STOPS = 10;
function mapOut(lat, lon){
  return "https://www.google.com/maps/dir/?api=1&destination="+lat+","+lon+"&travelmode=driving";
}
function mapOutRoute(stops, from){
  var list = stops.slice(0, MAPS_MAX_STOPS);
  if(!list.length) return "";
  var dest = list[list.length-1], mid = list.slice(0, -1);
  var u = "https://www.google.com/maps/dir/?api=1"+
          (from ? "&origin="+from.lat+","+from.lon : "")+
          "&destination="+dest.lat+","+dest.lon+"&travelmode=driving";
  if(mid.length) u += "&waypoints="+mid.map(function(p){ return p.lat+","+p.lon; }).join("%7C");
  return u;
}
function mapCard(stops, opts){
  opts=opts||{};
  return '<div class="card plain mapwrap">'+mapSvg(stops, opts)+
    (opts.legend===false ? '' : mapLegend(opts.legendItems ||
      [["todo","to do"],["done","serviced"],["issue","problem"],["dop","drop-off"],["me","you"]]))+
    (opts.legend===false ? '' : '<p class="sm" style="margin-top:-2px">Contours every '+
      contourStep+' m. The village climbs from the lower road to the Harissa side.</p>')+
    (opts.note? '<p class="sm">'+h(opts.note)+'</p>' : '')+'</div>';
}

/* ============ the route optimiser, and what it has learned ============
   Two models, both plain exponential moving averages over what actually
   happened, kept per role because a driver, a crew and a fee collector do
   not spend their time the same way at the same door.

     service[role][placeId]  minutes spent at that stop
     speed[role]             km per minute actually achieved between stops

   The optimiser minimises PREDICTED MINUTES, not kilometres, which is the
   whole point: the shortest round is not the quickest one when one stop
   reliably eats nine minutes. With no history it falls back to distance, so
   it is useful on day one and better by day thirty.                        */
var LEARN_ALPHA = 0.3;          /* how fast a new observation moves the mean */
var LEARN = {
  /* seeded from rounds already worked, so the first screen is not empty */
  service: {
    crew:      {"D-01-P":3.1,"D-04-P":2.6,"D-09-P":3.8,"D-13-P":2.4,"K-02-P":4.4,"K-06-P":3.0,
                "K-11-P":5.6,"R-03-P":5.2,"R-08-P":4.1,"R-14-P":6.3,"M-05-P":2.9,"M-10-P":3.3,
                "M-17-P":7.1,"W-02-P":4.8,"W-07-P":6.9,"S-01-P":8.7,"S-06-P":5.4,"S-12-P":3.6,
                "ST-01":6.2,"ST-02":5.8,"ST-03":7.4,"ST-04":5.1},
    driver:    {"D-01-P":1.8,"D-04-P":1.6,"D-09-P":2.0,"D-13-P":1.5,"K-02-P":2.2,"K-06-P":1.9,
                "K-11-P":2.8,"R-03-P":2.6,"R-08-P":2.3,"R-14-P":3.1,"M-05-P":1.7,"M-10-P":1.9,

function learnKeyFor(role, stop){ return role==="collector" ? stop.id : stop.id; }
/* Where the memory comes from. The copy in this file lasts until the tab closes;
   the one in the register outlives it, so when the register is live that is the
   one to believe. Both are the same decaying average, so they are comparable;
   the difference is only how long they survive. */
function learnedService(role, key){
  var L = LIVE.learning;
  if(L && L.role === role && L.service && L.service[key] && L.service[key].min != null){
    var v = Number(L.service[key].min);
    if(isFinite(v) && v > 0) return v;
  }
  return null;
}
function learnedSpeed(role){
  var L = LIVE.learning;
  if(L && L.role === role && L.speed && L.speed.km_per_min != null){
    var v = Number(L.speed.km_per_min);
    if(isFinite(v) && v > 0) return v;
  }
  return null;
}
function svcMin(role, stop){
  var key = learnKeyFor(role, stop);
  var live = learnedService(role, key);
  if(live != null) return live;
  var m = LEARN.service[role] || {};
  var v = m[key];
  return v != null ? v : (LEARN.defService[role] || 4);
}
function legMin(role, a, b){
  var sp = learnedSpeed(role) || LEARN.speed[role] || 0.3;
  return km(a.lat, a.lon, b.lat, b.lon) / sp;
}
/* which memory the screen is actually using, so it can say so rather than imply it */
function learnSource(role){
  var L = LIVE.learning;
  if(L && L.role === role && L.service && Object.keys(L.service).length)
    return {live:true, n:Object.keys(L.service).length,
            obs:(L.speed && L.speed.observations) || 0};
  return {live:false, n:Object.keys(LEARN.service[role]||{}).length, obs:LEARN.n[role]||0};
}
function routeMinutes(role, order){
  if(!order.length) return 0;
  var tot = svcMin(role, order[0]);
  for(var i=1;i<order.length;i++) tot += legMin(role, order[i-1], order[i]) + svcMin(role, order[i]);
  return tot;
}
/* nearest neighbour for a first guess, then 2-opt until it stops improving */
function optimiseRoute(role, stops, startAt){
  var pool = stops.slice();
  if(pool.length < 3) return pool;
  var start = startAt || pool[0];
  var order = [], cur = start;
  var rest = pool.filter(function(p){ return p !== start; });
  order.push(start);
  while(rest.length){
    var best=0, bestC=Infinity;
    rest.forEach(function(p,ix){
      var c = legMin(role, cur, p) + svcMin(role, p);
      if(c < bestC){ bestC=c; best=ix; }
    });
    cur = rest.splice(best,1)[0];
    order.push(cur);
  }
  var improved = true, guard = 0;
  while(improved && guard++ < 60){
    improved = false;
    for(var a=1; a<order.length-1; a++){
      for(var b=a+1; b<order.length; b++){
        var trial = order.slice(0,a).concat(order.slice(a,b+1).reverse(), order.slice(b+1));
        if(routeMinutes(role, trial) + 1e-9 < routeMinutes(role, order)){ order = trial; improved = true; }

    }

}

function naiveRoute(stops){ return stops.slice(); }
function routeSaving(role, stops){
  var before = routeMinutes(role, naiveRoute(stops));
  var after  = routeMinutes(role, optimiseRoute(role, stops));
  return {before:before, after:after, saved:Math.max(0, before-after),
          pct: before>0 ? Math.max(0, (before-after)/before*100) : 0};
}
/* a finished stop teaches the model. Called with the minutes actually spent. */
function learnStop(role, stopId, minutes){
  if(!(minutes>0) || minutes>180) return;                 /* a stale screen is not an observation */
  if(!LEARN.service[role]) LEARN.service[role]={};
  var m=LEARN.service[role], prev=m[stopId];
  m[stopId] = prev==null ? minutes : (prev*(1-LEARN_ALPHA) + minutes*LEARN_ALPHA);
  LEARN.n[role] = (LEARN.n[role]||0) + 1;

function learnLeg(role, kmDist, minutes){
  if(!(minutes>0) || !(kmDist>0)) return;

function optimiserView(){
  var role = S.role==="collector" ? "collector" : (S.role==="driver" ? "driver" : "crew");
  var stops = roundStops(role);
  var sv = routeSaving(role, rawStops(role));

  return ''+
  '<div class="note"><span>'+svg("route")+'</span><div><b>It plans in minutes, not kilometres</b>'+
  'The shortest round is not the quickest one when a stop reliably takes three times as long as its neighbours. '+
  'Every finished stop updates the average for that stop, and every leg updates the speed actually achieved.</div></div>'+

  '<div class="card acc"><p class="eyebrow">'+h(t("Today, for this round"))+'</p>'+
  '<div class="kv" style="border:none"><span>In register order</span><b>'+fmtMin(sv.before)+'</b></div>'+
  '<div class="kv"><span>In the order it suggests</span><b>'+fmtMin(sv.after)+'</b></div>'+
  '<div class="kv"><span>Saved</span><b style="color:var(--good)">'+fmtMin(sv.saved)+' &middot; '+sv.pct.toFixed(0)+'%</b></div></div>'+

  '<div class="card"><p class="eyebrow">'+h(t("Learned travel speed"))+'</p>'+
  '<div class="kv" style="border:none"><span>'+h(t(ROLES[role]?ROLES[role].label:role))+'</span>'+
  '<b>'+(LEARN.speed[role]*60).toFixed(1)+' km/h between stops</b></div>'+
  '<div class="kv"><span>Rounds observed</span><b class="num">'+(LEARN.n[role]||0)+'</b></div>'+
  '<p class="sm">Not a map speed limit &mdash; what this round, with this vehicle, on these streets, has actually achieved.</p></div>'+

  '<div class="sect"><span class="eyebrow">'+h(t("Minutes per stop, learned"))+'</span><span class="sm">longest first</span></div>'+
  '<div class="card plain">'+(keys.length? keys.map(function(k){
    var pl=placeById(k)||doorById(k), nm = pl ? (pl.n || (S.ar?pl.ar:pl.en)) : k;
    var w = Math.min(100, svc[k]/Math.max.apply(null,keys.map(function(x){return svc[x];}))*100);
    return '<button class="zrow" data-a="mappin" data-v="'+h(k)+'">'+
      '<div class="zhead"><b>'+h(nm)+'</b><span class="mono">'+svc[k].toFixed(1)+' min</span></div>'+
      '<div class="zb"><div class="ztrack"><i style="width:'+w.toFixed(0)+'%;background:var(--accent)"></i></div>'+
      '<em>'+h(k)+'</em></div></button>';
  }).join("") : '<p class="sm">Nothing learned yet. The first round sets the baseline.</p>')+'</div>'+

  '<div class="card plain"><p class="eyebrow">'+h(t("How it learns"))+'</p>'+
  '<div class="kv" style="border:none"><span>Method</span><b>nearest neighbour, then 2-opt</b></div>'+
  '<div class="kv"><span>Objective</span><b>predicted minutes</b></div>'+
  '<div class="kv"><span>Update</span><b>moving average, &alpha; = '+LEARN_ALPHA+'</b></div>'+
  '<div class="kv"><span>With no history</span><b>falls back to distance</b></div>'+

  'bad morning does not rewrite the plan, and a street that has genuinely got slower shows through within a few rounds. '+
  'An implausible reading &mdash; a screen left open over lunch &mdash; is discarded rather than learned.</p></div>'+

  '<button class="btn" data-a="resetserved">'+svg("sync","ic ic3")+h(t("Reset the round"))+'</button>';
}

  var up=COLLECTOR.obsUpheld, rj=COLLECTOR.obsRejected, mult=commMult(up,rj);
  var baseM=commBase(COLLECTOR.cashMonth), totM=commEarned(COLLECTOR.cashMonth, up, rj);
  var nextT=null; COMMISSION.tiers.forEach(function(t){ if(!nextT && up<t.obs) nextT=t; });
  return '<div class="card acc"><p class="eyebrow">This month</p>'+
    '<div class="big">'+money(totM)+'</div>'+
    '<div class="kv"><span>Cash collected</span><b>'+money(COLLECTOR.cashMonth)+'</b></div>'+
    '<div class="kv"><span>Commission at '+COMMISSION.rate+'%</span><b>'+money(baseM)+'</b></div>'+
    '<div class="kv"><span>Observation multiplier</span><b>&times;'+mult.toFixed(2)+'</b></div>'+
    '<div class="kv"><span>Paid '+h(COLLECTOR.lastPeriod)+'</span><b>'+money(COLLECTOR.lastPaid)+'</b></div></div>'+
    '<div class="note"><span>'+svg("cam")+'</span><div><b>Upheld observations, not filed ones</b>'+
    'The multiplier counts observations operations accepted. Filing more does not pay more; '+
    'each rejected one takes '+(COMMISSION.rejectedPenalty*100).toFixed(0)+' points off, and the multiplier never falls below &times;1.00.</div></div>'+
    '<div class="grid3">'+
    '<div class="stat"><b class="num">'+COLLECTOR.obsFiled+'</b><span>filed this month</span></div>'+
    '<div class="stat"><b class="num" style="color:var(--good)">'+up+'</b><span>upheld</span></div>'+
    '<div class="stat"><b class="num" style="color:var(--stamp)">'+rj+'</b><span>rejected</span></div></div>'+
    '<div class="sect"><span class="eyebrow">The ladder</span></div>'+
    '<div class="card plain">'+COMMISSION.tiers.map(function(tr){
      var on = up>=tr.obs;
      return '<div class="kv"><span>'+h(tr.en)+(tr.obs?' ('+tr.obs+'+)':'')+'</span>'+
        '<b style="'+(on?'color:var(--good)':'color:var(--muted)')+'">&times;'+tr.mult.toFixed(2)+(on?' &#10003;':'')+'</b></div>';
    }).join("")+'</div>'+
    (nextT? '<div class="card flat"><p class="sm">'+(nextT.obs-up)+' more upheld observations takes you to &times;'+nextT.mult.toFixed(2)+
      ' &mdash; worth about '+money(Math.round((commEarned(COLLECTOR.cashMonth,nextT.obs,rj)-totM)*100)/100)+' a month at this pace.</p></div>' : '')+
    '<button class="btn" data-a="tab" data-v="obs">'+svg("cam","ic")+'Log an observation</button>'+
    '<p class="sm">Commission is paid on cash actually deposited, after the round is reconciled. It is a cost of fee collection and sits in the municipality&rsquo;s own ledger, not in the collection contract.</p>';
};

function zoneBars(){
  return ZONES.slice().sort(function(a,b){ return b.rate-a.rate; })
   .map(function(z){ return '<div class="meter"><div class="lab"><span>'+h(S.ar?z.ar:z.en)+'</span><b>'+z.rate+'%</b></div>'+
     '<div class="bar"><i style="width:'+z.rate+'%"></i></div></div>'; }).join("");
}
/* The two numbers a council is judged on. Everything else on this screen
   explains them, so they lead and they are twice the size of anything else. */
function headlineRate(label, pct, sub, prev, invert){
  var delta = pct - prev, up = delta >= 0;
  var good = invert ? !up : up;
  return '<div class="hero">'+
    '<p class="eyebrow">'+h(label)+'</p>'+
    '<div class="hv">'+pct.toFixed(1)+'<span>%</span></div>'+
    '<div class="hbar"><i style="width:'+Math.max(0,Math.min(100,pct)).toFixed(0)+'%"></i></div>'+
    '<p class="sm">'+h(sub)+'</p>'+
    '<p class="sm" style="color:'+(good?"var(--good)":"var(--stamp)")+'">'+
      (up?"\u25b2 ":"\u25bc ")+Math.abs(delta).toFixed(1)+' points on last cycle</p>'+
  '</div>';
}
function townParticipation(){
  var b=0, n=0;
  ZONES.forEach(function(z){ b += z.recy*z.premises; n += z.premises; });
  return n? b/n : 0;
}

/* ---------------- generated analytics ---------------- */
function analytics(){
  var weak=ZONES.slice().sort(function(a,b){ return a.rate-b.rate; });
  var worstZone=weak[0], secondZone=weak[1];
  var worstSub=null, worstPct=101;
  ROUTEPERF.forEach(function(r){ r.subs.forEach(function(x){ var c=subCompletion(x); if(c<worstPct){ worstPct=c; worstSub=x; worstSub._type=r.en; } }); });
  var d=MUNI_DATA[S.muniMonth]||MUNI_DATA[MUNI_MONTHS[0]];
  var divRate=TONNES.divertedTruck/TONNES.total*100;
  var matVal=0; MATERIALS.forEach(function(m){ matVal+=m.usd; });
  var haulCost=COST_PER_TONNE*TONNES.total;
  var costShare=haulCost/Math.max(1,collected())*100;   /* haulage as a share of the tariff collected */
  return {worstZone:worstZone, secondZone:secondZone, worstSub:worstSub, worstPct:worstPct,
          d:d, divRate:divRate, matVal:matVal, haulCost:haulCost, costShare:costShare};
}

V["muni.recon"]=function(){

        '<span class="r"><button class="btn p sm" data-a="postpay" data-v="'+h(String(x.id))+'">'+
          h(t("Post"))+'</button>'+

/* No repaint: toggling a block must not wipe what has already been typed. */
function wireNewUser(){
  setTimeout(function(){
    var r=$("u_role"), c=$("u_cat"), blk=$("custblock"), pct=$("u_pct"), hint=$("u_pcthint");
    if(r && !r._w){ r._w=1; r.addEventListener("change", function(){
      S.nuRole=r.value;
      if(blk) blk.hidden = (r.value!=="customer");
    }); }
    if(c && !c._w){ c._w=1; c.addEventListener("change", function(){
      var cat=null; CATS.forEach(function(x){ if(x.id===c.value) cat=x; });
      if(!cat) return;
      if(pct) pct.value=cat.pct;
      if(hint) hint.textContent="Adopted band for "+(S.ar?cat.ar:cat.en)+" is "+cat.min+"\u2013"+cat.max+"%. At "+
        cat.pct+"% that is "+money(catMonthly({pct:cat.pct}))+" a month, "+money(catAnnual({pct:cat.pct}))+
        " a year. Anything outside the band is recorded as an override.";
    }); }
  }, 30);
  return '';
}

function doExport(k){
  var e=EXPORTS[k]; if(!e){ toast("Nothing to export"); return; }
  var rows=e[1];
  if(k==="participation"){
    rows=[rows[0]];
    ZONES.forEach(function(z){ rows.push([z.en,z.premises,z.recy,z.comp,z.qual,qualGrade(z.qual),z.down,z.bags,z.rate,z.route]); });
  }
  if(k==="inspections"){
    rows=[rows[0]];
    INSPECTIONS.forEach(function(i){ rows.push([i.id,i.at,i.kind,i.ref,i.result,i.contam,i.note]); });
  }
  if(k==="routes"){
    rows=[rows[0]];
    ROUTEPERF.forEach(function(r){ r.subs.forEach(function(x){
      rows.push([r.en,x.id,x.zone,x.planned,x.served,subCompletion(x).toFixed(1),x.min,subStopsPerHr(x),x.km,x.t,subKmPerT(x),x.onTime?"yes":"no"]);
    }); });
  }
  csv(e[0], rows);
}

document.addEventListener("click", function(ev){
  /* The switch is never itself subject to the rule it turns on. Someone who
     cannot read it out loud must still be able to turn it off. */
  var tog = ev.target.closest(".sndtog");
  if(tog){ ev.preventDefault(); ev.stopPropagation(); soundSet(!S.readFirst); return; }

  /* Read it first, then do it. The first touch on a control says what it is and
     stops there; the second touch, on the same control, goes through to the
     handler below as an ordinary press. */
  if(soundOn()){
    var ctl = ev.target.closest("[data-a], .seg[data-g] button");
    /* Reading the screen out is itself a reading action with nothing to undo,
       so making somebody press it twice is a rule applied for its own sake. */
    if(ctl && ctl.getAttribute("data-a") === "sayscreen") ctl = null;
    if(ctl){
      var key = ctlKey(ctl);
      var stale = (Date.now() - (S.armedAt || 0)) > ARM_MS;
      if(S.armed !== key || stale){
        ev.preventDefault(); ev.stopPropagation();
        var words = ctlSpeech(ctl);
        S.armed = key; S.armedEl = ctl; S.armedAt = Date.now();
        markArmed();
        if(words) speak(words);
        return;                       /* said, not done */
      }
      S.armed = null; S.armedEl = null; markArmed();   /* second touch: let it through */
    } else {
      /* not a control at all \u2014 a card, a note, a row of figures. Read it,
         and that is the whole of it; there is nothing to run. */
      var blk = readableBlock(ev.target);
      if(blk){
        var btxt = ownText(blk);
        if(btxt && btxt.length > 1){
          ev.preventDefault(); ev.stopPropagation();
          S.armed = null; S.armedEl = null; markArmed();
          speak(btxt.slice(0, 600));
          return;
        }
      }
    }
  }
  var seg = ev.target.closest(".seg[data-g] button");
  if(seg){
    var g=seg.parentNode.getAttribute("data-g"), v=seg.getAttribute("data-v");
    Array.prototype.forEach.call(seg.parentNode.children,function(b){ b.classList.remove("on"); });
    seg.classList.add("on");
    if(g==="stream"){ S.stream=v; paint(); }
    if(false){ var picked = (seg.textContent||"").replace(/\s+/g," ").trim();
      if(picked) speak(picked); }
    if(g==="lang"){ S.ar = v==="ar"; closeSheet(); paint(); }
    if(g==="cur2"){ S.lbp = v==="lbp"; closeSheet(); paint(); }
    if(g==="dk"){ S.drawKind=v; S.drawWinner=null; paint(); }
    if(g==="samn"){ S.sampleN=+v; }
    if(g==="ibx"){ S.inboxTab=v; paint(); }
    if(g==="apienv"){ APICFG.env=v; paint(); }
    if(g==="view"){ S.wide = v==="wide"; closeSheet(); paint(); }
    return;
  }
  var b = ev.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"), v=b.getAttribute("data-v"), x=b.getAttribute("data-x");

  switch(a){
    case "sendotp":
      S.phone = ($("ph")&&$("ph").value||"").trim();
      S.cc = ($("cc")&&$("cc").value) || S.cc || "961";
      if(!digits(S.phone)){ S.loginErr="Enter a mobile number"; paintLogin(); return; }
      if(LIVE.on){
        /* live, the register in the database is the gate, not the list in this file */
        S.liveBusy=true; S.loginErr=""; paintLogin();
        LIVE.sendCode("+"+S.cc+localPart(S.cc,S.phone)).then(function(){
          S.liveBusy=false; S.loginErr=""; S.otpErr=""; S.otpTries=0;
          S.liveNote="A code was sent on WhatsApp to that number."; S.step="otp"; paintLogin();
        }).catch(function(e){
          S.liveBusy=false; S.loginErr=LIVE.say(e); paintLogin();
        });
        return;
      }
      if(!phoneOk(S.phone)){ S.loginErr="That number is not on the register"; paintLogin(); return; }
      S.loginErr=""; S.otpErr=""; S.otpTries=0; S.step="otp"; paintLogin(); return;
    case "checkotp": {
      var code=digits($("otp")&&$("otp").value);
      if(code.length!==6){ S.otpErr="The code is six digits"; paintLogin(); return; }
      if(LIVE.on){
        S.liveBusy=true; S.otpErr=""; paintLogin();
        LIVE.verify("+"+S.cc+localPart(S.cc,S.phone), code)
          .then(function(){ return LIVE.loadProfile(); })
          .then(function(prof){
            S.who = prof.full_name || S.phone;
            S.liveNote = "Signed in against the register. Clearance: "+prof.clearance+".";
            return prof.clearance==="customer" ? LIVE.loadAccount().then(function(){ return prof; })
                                               : prof;
          })
          .then(function(prof){
            S.liveBusy=false; S.otpTries=0; S.otpErr="";
            /* a real clearance carries one interface. Only an administrator chooses. */
            if(prof.clearance!=="admin" && ROLES[prof.clearance]){
              S.role=prof.clearance; S.tab=ROLES[prof.clearance].tabs[0][0]; S.stack=[]; S.hist=[];
              $("view").className="view"; paint();
              toast("Signed in as "+t(ROLES[prof.clearance].label));
            } else { S.step="role"; paintLogin(); }
          })
          .catch(function(e){
            S.liveBusy=false; S.otpTries++; S.otpErr=LIVE.say(e); paintLogin();
          });
        return;
      }
      var ent=findNumber(S.cc, S.phone);
      if(!codeOk(ent, code)){
        S.otpTries++;
        S.otpErr = codeExpired()
          ? "The shared access code stopped working on "+untilText()+". Sign-in now needs a code sent to the number."
          : digits(code).length!==6 ? "The access code is six digits"
                                           : "That access code is not right";
        paintLogin(); return;
      }
      S.who=ent.name; S.otpErr=""; S.otpTries=0;
      /* a number on the register carries one clearance and lands straight in it.

      if(ent.role && ROLES[ent.role]){
        bindCustomer(ent);
        S.role=ent.role; S.tab=ROLES[ent.role].tabs[0][0]; S.stack=[]; S.hist=[];
        $("view").className="view"; paint();
        toast("Signed in as "+t(ROLES[ent.role].label));
        return;
      }
      S.step="role"; paintLogin(); return;
    }
    case "support": supportSheet(); return;
    case "clearance": clearanceSheet(v); return;
    case "setclearance": {
      var u2=null; REGISTER.forEach(function(r){ if(r.cc+"-"+r.n===v) u2=r; });
      if(!u2) return;
      var was = u2.role ? t(ROLES[u2.role].label) : t("Full clearance");

      var now = u2.role ? t(ROLES[u2.role].label) : t("Full clearance");
      if(was===now){ closeSheet(); toast("No change"); return; }
      AUDIT.unshift({at:"just now", who:S.who||"Administrator",
        what:"Clearance changed \u00b7 +"+u2.cc+" "+u2.n+" \u00b7 "+was+" \u2192 "+now});
      closeSheet(); paint();
      toast(u2.name+" \u00b7 "+now+" \u00b7 audited");
      return;
    }
    case "backphone": S.step="phone"; S.loginErr=""; S.otpErr=""; S.liveNote=""; paintLogin(); return;
    case "livetoggle":
      LIVE.signOut(); LIVE.on=!LIVE.on; LIVE.lastCheck=null;
      S.liveNote=""; S.role=null; S.step="phone"; S.phone=""; S.who=null;
      closeSheet(); $("view").className="login"; paintLogin();
      toast(LIVE.on? "Now reading the live register \u2014 sign in again"
                   : "Back to the built-in figures \u2014 sign in again");
      return;
    case "scandone": {
      var P1=parseCode(v);
      if(liveOn()){
        LIVE.logEvent({
          kind: P1.thing==="bag" ? "bag" : "point",
          code: v,
          premises_id: P1.thing==="bag" ? (P1.prem||ME.id||null) : null,

      sheet(t("Close the shift"),
        '<p class="b2">Nothing can be logged to a shift once it is closed. '+
        Object.keys(S.served).length+' stops worked, '+(S.loads||0)+' loads tipped.</p>'+
        '<label class="fld"><span>'+h(t("Closing odometer"))+'</span><input id="odo" class="mono" value="184,261"></label>'+
        '<label class="fld"><span>'+h(t("Anything to flag"))+'</span><textarea id="shnote" placeholder="left blank if nothing"></textarea></label>'+
        '<button class="btn p" data-a="endshiftdone">'+h(t("Close it"))+'</button>');
      return;
    case "endshiftdone":
      S.shiftOn=false; S.loads=0; S.served={}; S.skipped={}; S.stopOpenedAt={};
      closeSheet(); go("shift"); toast("Shift closed · recorded against the vehicle"); return;
    case "fault": S.faultFor = v || ""; S.photoShot=""; push("fault"); return;
    case "faultsend": {
      var nt = $("fnote") ? $("fnote").value : "";
      if(!nt.trim()){ toast("Say what is wrong — a fault without a note cannot be acted on"); return; }
      FAULTS.unshift({id:"FT-"+(1050+FAULTS.length), where:S.faultFor||"—",
        what:(($("fkind")&&$("fkind").value)||FAULT_KINDS[0]), by:S.who||t(ROLES[S.role].label),
        at:"just now", photo:!!S.photoShot, note:nt});
      S.photoShot=""; back(); toast("Fault logged"+(FAULTS[0].photo?" with a photograph":" — add a photograph when you can"));
      return;
    }

    /* collector */
    case "nobody": {
      var dn = doorById(v);
      serveLearn(v); S.visited[v]=true;
      /* the household should hear it from us before they hear nothing at all */
      if(dn){
        var msg = "Baladi \u2014 "+TOWN+"\n\nWe called at "+dn.a+" today for the waste fee and could not find you.\n"+
          "Account "+dn.id+(dn.due? "\nBalance "+money(dn.due) : "")+
          "\nReference "+payRef(dn.id,2026,2)+
          "\n\nYou can pay without waiting for us \u2014 put that reference in the transfer note, or come to the counter. "+
          "Allow up to "+PAY_SETTLE_HOURS+" hours for it to show.\n\nbaladiservice.com";
        S.lastMissed = {id:dn.id, name:dn.n, msisdn:dn.msisdn, link:waLink(dn.msisdn, msg)};
        push("missed");
      } else { S.stack=[]; paint(); }
      toast("Nobody home \u00b7 the household is being told");
      return;
    }
    /* an exemption is a decision about somebody's money, so it is evidenced and audited */
    case "openround": S.roundOpen=true; push("tellthem"); return;
    case "toldthem": S.notified[v]=true; paint(); return;
    case "exempt": S.exemptFor = v; S.photoShot=""; push("exempt"); return;
    case "exemptsend": {
      var rsn = ($("exreason")&&$("exreason").value) || EXEMPT_REASONS[0];
      var nte = ($("exnote")&&$("exnote").value) || "";
      if(!nte.trim()){ toast("An exemption needs a note \u2014 it is somebody\u2019s money"); return; }
      var dd2 = doorById(S.exemptFor);
      EXEMPTIONS.unshift({id:"EX-"+(2200+EXEMPTIONS.length), prem:S.exemptFor,
        name:dd2?dd2.n:"", reason:rsn, note:nte, by:S.who||t(ROLES[S.role].label),
        at:"just now", photo:!!S.photoShot, state:"proposed"});
      S.photoShot="";
      back(); toast("Exemption proposed \u00b7 the municipality decides, not the collector");
      return;
    }
    case "markpaid": serveLearn(v); S.visited[v]=true; S.stack=[]; toast("Payment banked against "+v); paint(); return;
    case "resetround": S.visited={}; toast("Round reset"); paint(); return;
    case "deposit": toast("Deposit recorded · cash on hand reset"); return;
    case "obssend": {
      var subj=S.obsSubject||(($("obs_subj")&&$("obs_subj").value)||"");
      if(needsEvidence(subj) && !S.photoShot){
        toast("A photograph is required before this report can be sent"); return;
      }
      ROUTE_DOORS.forEach(function(x){ if(x.id===subj) x.flags=(x.flags||0)+1; });
      COLLECTOR.obsFiled++;
      S.obsSubject=""; S.obsKind=null; S.photoShot="";
      S.stack=[]; paint();
      toast("Report sent to operations"+(subj?" \u00b7 "+subj:"")); return;
    }

    /* handheld storage mode */
    case "pull":
      BATCH.forEach(function(x){ x.r=false; });
      toast(BATCH.length+" stored scans pulled from the handheld"); push("batch"); return;
    case "ackall":
      BATCH.forEach(function(x){ if(!x.r){ x.r=true; x.o="presence acknowledged"; } });
      toast("Remaining scans filed as presence acknowledged"); paint(); return;
    case "batchopen":
      var bi=+v, it=BATCH[bi], P2=parseCode(it.c);
      sheet(codeLabel(P2),
        '<p class="sm mono">'+h(it.c)+' · '+h(it.at)+'</p>'+
        (P2.thing==="bag" ? '<div class="sect"><span class="eyebrow">Rank the bag</span></div><div class="chips" id="brank">'+
            RANKS.map(function(r){ return '<button class="chip'+(it.q===r.id?" on":"")+'" data-a="brank" data-v="'+bi+'|'+r.id+'">'+svg(r.ic,"ic")+h(S.ar?r.ar:r.en)+'</button>'; }).join("")+'</div>'
          : '<div class="sect"><span class="eyebrow">What was at the point</span></div><div class="chips" id="brank">'+
            POINT_OUTCOMES.map(function(o,ix){ return '<button class="chip'+(it.o===o?" on":"")+'" data-a="bout" data-v="'+bi+'|'+encodeURIComponent(o)+'">'+svg(POINT_ICONS[ix],"ic")+h(S.ar?POINT_OUTCOMES_AR[ix]:o)+'</button>'; }).join("")+'</div>')+
        '<div class="sect"><span class="eyebrow">'+h(t("Comment"))+'</span></div>'+
        '<div class="chips">'+SCAN_COMMENTS.map(function(c,i){
          return '<button class="chip'+(i===0?" on":"")+'" data-a="cmt" data-v="'+c.id+'">'+svg(c.ic,"ic")+h(S.ar?c.ar:c.en)+'</button>'; }).join("")+'</div>'+
        '<div id="cmtbox"></div>'+
        '<button class="btn p" data-a="bsave" data-v="'+bi+'">'+h(t("Save"))+'</button>'+
        '<p class="sm">Leave it and it files itself as presence acknowledged. Open it only when the bag needs a rank or the point needs a note.</p>');
      return;
    case "brank":
      var pr=v.split("|"); BATCH[+pr[0]].q=pr[1];
      Array.prototype.forEach.call(b.parentNode.children,function(c){ c.classList.remove("on"); }); b.classList.add("on"); return;
    case "bout":
      var po=v.split("|"); BATCH[+po[0]].o=decodeURIComponent(po[1]);
      Array.prototype.forEach.call(b.parentNode.children,function(c){ c.classList.remove("on"); }); b.classList.add("on"); return;
    case "bsave":
      var ix=+v; BATCH[ix].r=true;
      if(!BATCH[ix].o) BATCH[ix].o = BATCH[ix].q ? (RANKS.filter(function(r){return r.id===BATCH[ix].q;})[0]||{en:"reviewed"}).en : "presence acknowledged";
      closeSheet(); toast("Scan reviewed"); paint(); return;
    case "rank":
      S.scanRank=v; S.scanTouched=true; paint();
      toast("Bag ranked "+(RANKS.filter(function(r){return r.id===v;})[0]||{en:""}).en.toLowerCase()); return;

    /* ops + review */
    case "opsrow": if(+v===3) push("resolve"); else toast("Opened the vehicle and load record"); return;
    case "res": S.stack=[]; toast(v); paint(); return;
    case "rev": toast(v); return;

    /* admin */
    case "ovr": b.classList.toggle("on"); return;
    case "savetariff":
      var c2=null; CATS.forEach(function(x){ if(x.id===v) c2=x; });
      var val=parseFloat(($("tpct")&&$("tpct").value)||"0");
      var over=$("ovr")&&$("ovr").classList.contains("on");
      if(!(val>0)){ toast("Enter a rate"); return; }
      if((val<c2.min||val>c2.max) && !over){ toast("Outside the statutory band — turn on Override and give a reason"); return; }
      if((val<c2.min||val>c2.max) && !(($("treason")&&$("treason").value)||"").trim()){ toast("An override needs a written reason"); return; }
      S.tariff[v]=Math.round(val*10)/10; back();
      toast(c2.en+" set to "+S.tariff[v]+"% · "+money(MINWAGE*S.tariff[v]/100)+" a month"); return;
    case "resetTariff": CATS.forEach(function(c){ S.tariff[c.id]=c.pct; }); toast("Reset to the adopted schedule"); paint(); return;
    case "rundraw": runDraw(); return;
    case "notifywin": toast("Winner notified by SMS and WhatsApp · prize recorded against the account"); return;
    case "adduser": toast("A number is added against one clearance, and audited"); return;
    case "approvepay": toast("Payout approved · queued for the bank file"); return;
  }
});
$("snap").addEventListener("change", function(e){
  var f=e.target.files && e.target.files[0];
  if(!f) return;
  if(S.camPhoto || S.photoCtx){
    var rd=new FileReader();
    rd.onload=function(){ S.photoShot=rd.result; S.camPhoto=false; paint(); toast("Photograph attached"); };
    rd.readAsDataURL(f);
    e.target.value="";   /* so picking the same file twice still fires a change */
    return;
  }
  toast("Reading the photograph"); decodeImageFile(f);
});
document.addEventListener("input", function(e){
  if(e.target && e.target.id==="tpct"){
    var p=parseFloat(e.target.value)||0, el=$("tprev"); if(el) el.textContent=money(MINWAGE*p/100);
  }
});
document.addEventListener("change", function(ev){
  var el=ev.target; if(!el || !el.id) return;
  if(el.id==="mmonth"){ S.muniMonth=el.value; paint(); return; }
  if(el.id==="u_role"){
    var cb=$("custblock"); if(cb) cb.style.display = (el.value==="customer") ? "" : "none";
    return;
  }
  if(el.id==="u_cat"){
    var c=null; CATS.forEach(function(x){ if(x.id===el.value) c=x; });
    if(!c) return;
    var pe=$("u_pct"); if(pe) pe.value=c.pct;
    var hint=$("u_pcthint");
    if(hint) hint.innerHTML='Adopted band for '+h(S.ar?c.ar:c.en)+' is '+c.min+'&ndash;'+c.max+'%. '+
      'At '+c.pct+'% that is '+money(catMonthly({pct:c.pct}))+' a month, '+money(catAnnual({pct:c.pct}))+' a year. '+
      'Anything outside the band is recorded as an override.';
    return;
  }
});
$("scrim").addEventListener("click", closeSheet);

/* A repaint on every resize destroyed whatever input had focus. On Android the
   soft keyboard opening IS a resize, so typing into any field dismissed the
   keyboard and lost the field. Only a WIDTH change can affect the layout, and
   never while someone is typing. */
var rzT=null, rzW=(typeof window!=="undefined" ? window.innerWidth : 0);
function isTyping(){
  var a=document.activeElement;
  return !!(a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA" || a.isContentEditable));
}
window.addEventListener("resize", function(){
  if(window.innerWidth === rzW) return;      /* the keyboard changed the height, not the layout */
  rzW = window.innerWidth;
  clearTimeout(rzT);
  rzT=setTimeout(function(){
    if(!S.role || isTyping()) return;
    paint();
  }, 250);
});

var timerI=null;
function startTimer(){ stopTimer(); timerI=setInterval(function(){
  S.tLeft--; var e=$("ptimer");
  if(e) e.textContent="0:"+(S.tLeft<10?"0":"")+Math.max(0,S.tLeft);
  if(S.tLeft<=0){ stopTimer(); S.pickupPhoto=false; S.stack=[]; toast("The minute ran out · the request is queued for a reviewer"); paint(); }
},1000); }
function stopTimer(){ if(timerI) clearInterval(timerI), timerI=null; }

/* ============================== boot ============================== */
function tick(){
  var d=new Date();
  $("clock").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
tick(); setInterval(tick,20000);
soundRestore();
try{ history.replaceState({b:0}, ""); history.pushState({b:1}, ""); }catch(e){}
paint();
</script>
